ris (i O-ra)<\/td><\/tr><tr><td class=\"m\">3:10<\/td><td class=\"g\">τρεις και δέκα<\/td><td class=\"m\">tris ke DHE-ka<\/td><\/tr><tr><td class=\"m\">3:15<\/td><td class=\"g\">τρεις και τέταρτο<\/td><td class=\"m\">tris ke TE-tar-to<\/td><\/tr><tr><td class=\"m\">3:30<\/td><td class=\"g\">τρεις και μισή<\/td><td class=\"m\">tris ke mi-SI<\/td><\/tr><tr><td class=\"m\">3:45<\/td><td class=\"g\">τέσσερις παρά τέταρτο<\/td><td class=\"m\">TE-se-ris pa-RA TE-tar-to<\/td><\/tr><tr><td class=\"m\">3:50<\/td><td class=\"g\">τέσσερις παρά δέκα<\/td><td class=\"m\">TE-se-ris pa-RA DHE-ka<\/td><\/tr><tr><td class=\"m\">1:00<\/td><td class=\"g\">μία η ώρα<\/td><td class=\"m\">MI-a i O-ra<\/td><\/tr><tr><td class=\"m\">12:00<\/td><td class=\"g\">δώδεκα, μεσημέρι<\/td><td class=\"m\">DHO-dhe-ka, me-si-ME-ri<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A1"}, {"id": "gr-meres", "sec": "numeros", "k": "tabla", "t": "Μέρες και μήνες", "tr": "Méres ke mínes", "es": "Días y meses", "uso": "De lunes a jueves los días son ordinales: Δευτέρα (segundo), Τρίτη (tercero), Τετάρτη (cuarto), Πέμπτη (quinto). Παρασκευή es «preparación» y Κυριακή, «del Señor», como nuestro domingo.", "pr": "dhef-TE-ra, TRI-ti, te-TAR-ti…", "ej": [["Την Κυριακή είναι κλειστό.", "El domingo está cerrado.", "Tin Kiriakí íne klistó."], ["Αύριο το πρωί.", "Mañana por la mañana.", "Ávrio to proí."]], "nota": "Para decir «el lunes» se usa el acusativo con artículo: την Δευτέρα. Ver [[gr-cases]].", "rel": ["gr-ora", "gr-numbers", "gr-cases"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Español<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Δευτέρα<\/td><td class=\"\">lunes<\/td><td class=\"m\">dhef-TE-ra<\/td><\/tr><tr><td class=\"g\">Τρίτη<\/td><td class=\"\">martes<\/td><td class=\"m\">TRI-ti<\/td><\/tr><tr><td class=\"g\">Τετάρτη<\/td><td class=\"\">miércoles<\/td><td class=\"m\">te-TAR-ti<\/td><\/tr><tr><td class=\"g\">Πέμπτη<\/td><td class=\"\">jueves<\/td><td class=\"m\">PEM-ti<\/td><\/tr><tr><td class=\"g\">Παρασκευή<\/td><td class=\"\">viernes<\/td><td class=\"m\">pa-ras-ke-VI<\/td><\/tr><tr><td class=\"g\">Σάββατο<\/td><td class=\"\">sábado<\/td><td class=\"m\">SA-va-to<\/td><\/tr><tr><td class=\"g\">Κυριακή<\/td><td class=\"\">domingo<\/td><td class=\"m\">ki-ria-KI<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Español<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Ιανουάριος<\/td><td class=\"\">enero<\/td><td class=\"m\">ia-nu-A-rios<\/td><\/tr><tr><td class=\"g\">Φεβρουάριος<\/td><td class=\"\">febrero<\/td><td class=\"m\">fev-ru-A-rios<\/td><\/tr><tr><td class=\"g\">Μάρτιος<\/td><td class=\"\">marzo<\/td><td class=\"m\">MAR-tios<\/td><\/tr><tr><td class=\"g\">Απρίλιος<\/td><td class=\"\">abril<\/td><td class=\"m\">a-PRI-lios<\/td><\/tr><tr><td class=\"g\">Μάιος<\/td><td class=\"\">mayo<\/td><td class=\"m\">MA-ios<\/td><\/tr><tr><td class=\"g\">Ιούνιος<\/td><td class=\"\">junio<\/td><td class=\"m\">i-U-nios<\/td><\/tr><tr><td class=\"g\">Ιούλιος<\/td><td class=\"\">julio<\/td><td class=\"m\">i-U-lios<\/td><\/tr><tr><td class=\"g\">Αύγουστος<\/td><td class=\"\">agosto<\/td><td class=\"m\">AV-gus-tos<\/td><\/tr><tr><td class=\"g\">Σεπτέμβριος<\/td><td class=\"\">septiembre<\/td><td class=\"m\">sep-TEM-vrios<\/td><\/tr><tr><td class=\"g\">Οκτώβριος<\/td><td class=\"\">octubre<\/td><td class=\"m\">ok-TO-vrios<\/td><\/tr><tr><td class=\"g\">Νοέμβριος<\/td><td class=\"\">noviembre<\/td><td class=\"m\">no-EM-vrios<\/td><\/tr><tr><td class=\"g\">Δεκέμβριος<\/td><td class=\"\">diciembre<\/td><td class=\"m\">dhe-KEM-vrios<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Español<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">σήμερα<\/td><td class=\"\">hoy<\/td><td class=\"m\">SI-me-ra<\/td><\/tr><tr><td class=\"g\">αύριο<\/td><td class=\"\">mañana<\/td><td class=\"m\">AV-rio<\/td><\/tr><tr><td class=\"g\">χθες<\/td><td class=\"\">ayer<\/td><td class=\"m\">jthes<\/td><\/tr><tr><td class=\"g\">απόψε<\/td><td class=\"\">esta noche<\/td><td class=\"m\">a-PO-pse<\/td><\/tr><tr><td class=\"g\">μέρα / νύχτα<\/td><td class=\"\">día / noche<\/td><td class=\"m\">ME-ra / NIJ-ta<\/td><\/tr><\/tbody><\/table><\/div>", "truco": "De lunes a jueves son «segundo, tercero, cuarto, quinto»: la semana griega empieza en domingo.", "lvl": "A1"}, {"id": "gr-articles", "sec": "gramatica", "k": "regla", "t": "Los artículos: ο, η, το", "es": "El artículo marca género, número y caso", "uso": "El griego tiene artículo definido con tres géneros. Se usa más que en español: también con nombres propios (ο Γιώργος, η Αθήνα). El indefinido es igual que el número uno: ένας, μία, ένα.", "ej": [["ο καφές, η μπίρα, το νερό", "el café, la cerveza, el agua"], ["οι καφέδες, οι μπίρες, τα νερά", "los cafés, las cervezas, las aguas"]], "nota": "η y οι suenan igual, «i». El contexto y la terminación del nombre aclaran cuál es.", "rel": ["gr-gender", "gr-cases", "gr-plural", "gr-pou-einai", "gr-domatio"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th><\/th><th>Masculino<\/th><th>Femenino<\/th><th>Neutro<\/th><\/tr><\/thead><tbody><tr><td class=\"\">Singular<\/td><td class=\"g\">ο<\/td><td class=\"g\">η<\/td><td class=\"g\">το<\/td><\/tr><tr><td class=\"\">Plural<\/td><td class=\"g\">οι<\/td><td class=\"g\">οι<\/td><td class=\"g\">τα<\/td><\/tr><tr><td class=\"\">Indefinido<\/td><td class=\"g\">ένας<\/td><td class=\"g\">μία / μια<\/td><td class=\"g\">ένα<\/td><\/tr><\/tbody><\/table><\/div>", "truco": "Ο, η, το: masculino, femenino, neutro. Si el nombre acaba en -ο, -ι o -μα, casi seguro que es «το».", "err": [["η νερό", "το νερό", "«Νερό» es neutro, aunque «el agua» sea femenino en español."]], "ejx": [["___ καφές (el café)", "ο"], ["___ μπίρα (la cerveza)", "η"], ["___ νερό (el agua)", "το"], ["___ εισιτήρια (los billetes)", "τα"]], "lvl": "A1"}, {"id": "gr-gender", "sec": "gramatica", "k": "regla", "t": "Los tres géneros", "es": "Masculino, femenino y neutro", "uso": "Cada nombre tiene género y no siempre coincide con el español: el agua, el vino y la habitación son neutros en griego. La terminación da una buena pista.", "ej": [["το δωμάτιο, το νερό, το κρασί", "la habitación, el agua, el vino (neutros)"], ["η οδός", "la calle (femenino, aunque acabe en -ος)"]], "rel": ["gr-articles", "gr-adjectives", "gr-dromos", "gr-numbers", "gr-plural"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Género<\/th><th>Terminaciones típicas<\/th><th>Ejemplos<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Masculino<\/td><td class=\"m\">-ος, -ας, -ης, -ές<\/td><td class=\"\">ο δρόμος, ο χάρτης, ο καφές<\/td><\/tr><tr><td class=\"g\">Femenino<\/td><td class=\"m\">-α, -η<\/td><td class=\"\">η βαλίτσα, η στάση, η πτήση<\/td><\/tr><tr><td class=\"g\">Neutro<\/td><td class=\"m\">-ο, -ι, -μα<\/td><td class=\"\">το πλοίο, το κλειδί, το όνομα<\/td><\/tr><\/tbody><\/table><\/div>", "ejx": [["___ δωμάτιο", "το"], ["___ βαλίτσα", "η"], ["___ δρόμος", "ο"], ["___ πτήση", "η"]], "lvl": "A1"}, {"id": "gr-cases", "sec": "gramatica", "k": "regla", "t": "Los casos", "es": "Nominativo, acusativo y genitivo", "uso": "Artículo y terminación cambian según la función de la palabra. Para viajar bastan tres casos: nominativo (sujeto), acusativo (lo que pides o buscas, y detrás de casi todas las preposiciones) y genitivo (posesión, «de»).", "ej": [["Ο λογαριασμός είναι εδώ.", "La cuenta está aquí. (nominativo)"], ["Τον λογαριασμό, παρακαλώ.", "La cuenta, por favor. (acusativo)"], ["Η στάση του λεωφορείου.", "La parada del autobús. (genitivo)"]], "nota": "El masculino en -ος pierde la s en acusativo: ο κατάλογος → τον κατάλογο.", "rel": ["gr-katalogo", "gr-logariasmo", "gr-articles", "gr-prepositions", "gr-leoforeio", "gr-meres"], "body": "<h4>El artículo en singular<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Caso<\/th><th>Masculino<\/th><th>Femenino<\/th><th>Neutro<\/th><\/tr><\/thead><tbody><tr><td class=\"\">Nominativo<\/td><td class=\"g\">ο<\/td><td class=\"g\">η<\/td><td class=\"g\">το<\/td><\/tr><tr><td class=\"\">Acusativo<\/td><td class=\"g\">τον<\/td><td class=\"g\">την / τη<\/td><td class=\"g\">το<\/td><\/tr><tr><td class=\"\">Genitivo<\/td><td class=\"g\">του<\/td><td class=\"g\">της<\/td><td class=\"g\">του<\/td><\/tr><\/tbody><\/table><\/div><h4>El artículo en plural<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Caso<\/th><th>Masculino<\/th><th>Femenino<\/th><th>Neutro<\/th><\/tr><\/thead><tbody><tr><td class=\"\">Nominativo<\/td><td class=\"g\">οι<\/td><td class=\"g\">οι<\/td><td class=\"g\">τα<\/td><\/tr><tr><td class=\"\">Acusativo<\/td><td class=\"g\">τους<\/td><td class=\"g\">τις<\/td><td class=\"g\">τα<\/td><\/tr><tr><td class=\"\">Genitivo<\/td><td class=\"g\">των<\/td><td class=\"g\">των<\/td><td class=\"g\">των<\/td><\/tr><\/tbody><\/table><\/div><h4>Un nombre de cada género<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Caso<\/th><th>la cuenta<\/th><th>la parada<\/th><th>el agua<\/th><\/tr><\/thead><tbody><tr><td class=\"\">Nom.<\/td><td class=\"g\">ο λογαριασμός<\/td><td class=\"g\">η στάση<\/td><td class=\"g\">το νερό<\/td><\/tr><tr><td class=\"\">Ac.<\/td><td class=\"g\">τον λογαριασμό<\/td><td class=\"g\">τη στάση<\/td><td class=\"g\">το νερό<\/td><\/tr><tr><td class=\"\">Gen.<\/td><td class=\"g\">του λογαριασμού<\/td><td class=\"g\">της στάσης<\/td><td class=\"g\">του νερού<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "truco": "¿Pides algo o va detrás de una preposición? τον / την / το. ¿Es «de» algo? του / της.", "err": [["Ο λογαριασμός, παρακαλώ.", "Τον λογαριασμό, παρακαλώ.", "Lo que pides va en acusativo."]], "ejx": [["Θέλω ___ λογαριασμό. (acusativo masculino)", "τον"], ["Η στάση ___ λεωφορείου (del autobús)", "του"], ["___ κατάλογο, παρακαλώ.", "τον"]]}, {"id": "gr-einai", "sec": "gramatica", "k": "regla", "t": "Είμαι: ser y estar", "es": "Un solo verbo para los dos", "uso": "Como en inglés, el griego no distingue ser y estar. El pronombre sujeto (εγώ, εσύ…) se omite casi siempre, igual que en español.", "ej": [["Είμαι από την Ισπανία.", "Soy de España.", "Íme apó tin Ispanía."], ["Είναι κλειστό.", "Está cerrado.", "Íne klistó."], ["Πού είστε;", "¿Dónde están ustedes?", "Pu íste?"]], "nota": "Pasado: ήμουν, ήσουν, ήταν, ήμασταν, ήσασταν, ήταν. «Ήταν πολύ ωραία» = fue muy bonito.", "rel": ["gr-me-lene", "gr-chortofagos", "gr-pou-einai", "gr-pronouns"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Persona<\/th><th>Griego<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"\">yo<\/td><td class=\"g\">είμαι<\/td><td class=\"m\">I-me<\/td><\/tr><tr><td class=\"\">tú<\/td><td class=\"g\">είσαι<\/td><td class=\"m\">I-se<\/td><\/tr><tr><td class=\"\">él, ella, ello<\/td><td class=\"g\">είναι<\/td><td class=\"m\">I-ne<\/td><\/tr><tr><td class=\"\">nosotros<\/td><td class=\"g\">είμαστε<\/td><td class=\"m\">I-ma-ste<\/td><\/tr><tr><td class=\"\">vosotros / usted<\/td><td class=\"g\">είστε<\/td><td class=\"m\">I-ste<\/td><\/tr><tr><td class=\"\">ellos<\/td><td class=\"g\">είναι<\/td><td class=\"m\">I-ne<\/td><\/tr><\/tbody><\/table><\/div>", "ejx": [["Εγώ ___ από την Ισπανία.", "είμαι"], ["Πού ___ η στάση;", "είναι"], ["Εμείς ___ από τη Σεβίλλη.", "είμαστε"]], "lvl": "A1"}, {"id": "gr-verbs-present", "sec": "gramatica", "k": "regla", "t": "El presente", "es": "Dos grandes grupos de verbos", "uso": "Grupo A: acaban en -ω sin acento (κάνω, θέλω, έχω). Grupo B: acaban en -άω o -ώ acentuada (μιλάω, πονάω, μπορώ). El griego moderno no tiene infinitivo: el diccionario da la primera persona («κάνω» = hago / hacer).", "ej": [["Τι κάνεις;", "¿Qué tal? (¿qué haces?)", "Ti kánis?"], ["Μιλάτε ισπανικά;", "¿Habla español?", "Miláte ispaniká?"], ["Έχετε νερό;", "¿Tiene agua?", "Échete neró?"]], "rel": ["gr-ti-kaneis", "gr-milate", "gr-thelo-na", "gr-einai", "gr-poso-kanei", "gr-boro-na"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Persona<\/th><th>κάνω (hacer)<\/th><th>έχω (tener)<\/th><th>μιλάω (hablar)<\/th><\/tr><\/thead><tbody><tr><td class=\"\">yo<\/td><td class=\"g\">κάνω<\/td><td class=\"g\">έχω<\/td><td class=\"g\">μιλάω<\/td><\/tr><tr><td class=\"\">tú<\/td><td class=\"g\">κάνεις<\/td><td class=\"g\">έχεις<\/td><td class=\"g\">μιλάς<\/td><\/tr><tr><td class=\"\">él, ella<\/td><td class=\"g\">κάνει<\/td><td class=\"g\">έχει<\/td><td class=\"g\">μιλάει<\/td><\/tr><tr><td class=\"\">nosotros<\/td><td class=\"g\">κάνουμε<\/td><td class=\"g\">έχουμε<\/td><td class=\"g\">μιλάμε<\/td><\/tr><tr><td class=\"\">vosotros / usted<\/td><td class=\"g\">κάνετε<\/td><td class=\"g\">έχετε<\/td><td class=\"g\">μιλάτε<\/td><\/tr><tr><td class=\"\">ellos<\/td><td class=\"g\">κάνουν<\/td><td class=\"g\">έχουν<\/td><td class=\"g\">μιλάνε<\/td><\/tr><\/tbody><\/table><\/div><p>«Έχει» también significa «hay»: «Έχει ζεστό νερό;» (¿hay agua caliente?).<\/p>", "truco": "La terminación ya dice quién: -ω yo, -εις tú, -ει él, -ουμε nosotros, -ετε vosotros/usted, -ουν ellos.", "ejx": [["Τι ___ ; (κάνω, tú)", "κάνεις"], ["___ νερό; (έχω, usted)", "έχετε"], ["___ αγγλικά; (μιλάω, usted)", "μιλάτε"]], "lvl": "A1"}, {"id": "gr-negation", "sec": "gramatica", "k": "regla", "t": "La negación: δεν, μην, όχι", "es": "Tres formas de decir «no»", "uso": "«Δεν» va delante del verbo para negar. «Μην» se usa para prohibir y después de «να». «Όχι» es el «no» de respuesta y sirve para negar palabras sueltas.", "ej": [["Δεν καταλαβαίνω.", "No entiendo.", "Den katalavéno."], ["Δεν έχω μετρητά.", "No tengo efectivo.", "Den écho metritá."], ["Μην ανησυχείτε.", "No se preocupe.", "Min anisichíte."], ["Όχι αυτό, εκείνο.", "Eso no, aquello.", "Óchi aftó, ekíno."]], "rel": ["gr-den-katalaveno", "gr-den-doulevei", "gr-nai-ochi", "gr-valitsa", "gr-thelo-na"], "err": [["Όχι καταλαβαίνω.", "Δεν καταλαβαίνω.", "«Όχι» no va delante del verbo."]], "ejx": [["___ καταλαβαίνω.", "δεν"], ["___ ανησυχείτε. (no se preocupe)", "μην"], ["— Είναι μακριά; — ___, είναι κοντά.", "όχι"]], "lvl": "A1"}, {"id": "gr-question-mark", "sec": "gramatica", "k": "regla", "t": "Las preguntas y el signo ;", "es": "El punto y coma es la interrogación", "uso": "El griego cierra las preguntas con «;» y no tiene signo de apertura. El orden de las palabras no cambia: basta con subir la entonación al final, como en español. El punto alto «·» hace de punto y coma.", "ej": [["Είναι μακριά;", "¿Está lejos?", "Íne makriá?"], ["Έχετε νερό;", "¿Tiene agua?", "Échete neró?"]], "rel": ["gr-ti-kaneis", "gr-interrogatives", "gr-proino"], "err": [["¿Είναι μακριά?", "Είναι μακριά;", "Sin signo de apertura y con «;» al final."]], "ejx": [["¿Qué signo cierra una pregunta en griego? ___", ";"]], "lvl": "A1"}, {"id": "gr-interrogatives", "sec": "gramatica", "k": "regla", "t": "Palabras para preguntar", "es": "Τι, πού, πότε, πόσο…", "uso": "Van al principio de la pregunta, como en español. Llevan tilde las que tienen más de una sílaba, y πού y πώς para distinguirlas de που (que) y πως (que).", "ej": [["Πότε ανοίγει;", "¿Cuándo abre?", "Póte aníyi?"], ["Πώς πάω στο λιμάνι;", "¿Cómo voy al puerto?", "Pos páo sto limáni?"]], "rel": ["gr-pou-einai", "gr-poso-kanei", "gr-pote-fevgei", "gr-wifi", "gr-question-mark", "gr-ploio"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Se pronuncia<\/th><th>Español<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Τι<\/td><td class=\"m\">ti<\/td><td class=\"\">qué<\/td><\/tr><tr><td class=\"g\">Πού<\/td><td class=\"m\">pu<\/td><td class=\"\">dónde<\/td><\/tr><tr><td class=\"g\">Πότε<\/td><td class=\"m\">PO-te<\/td><td class=\"\">cuándo<\/td><\/tr><tr><td class=\"g\">Τι ώρα<\/td><td class=\"m\">ti O-ra<\/td><td class=\"\">a qué hora<\/td><\/tr><tr><td class=\"g\">Πόσο<\/td><td class=\"m\">PO-so<\/td><td class=\"\">cuánto (precio)<\/td><\/tr><tr><td class=\"g\">Πόσα / πόσοι<\/td><td class=\"m\">PO-sa / PO-si<\/td><td class=\"\">cuántos<\/td><\/tr><tr><td class=\"g\">Ποιος / ποια / ποιο<\/td><td class=\"m\">pios / pia / pio<\/td><td class=\"\">quién, cuál<\/td><\/tr><tr><td class=\"g\">Πώς<\/td><td class=\"m\">pos<\/td><td class=\"\">cómo<\/td><\/tr><tr><td class=\"g\">Γιατί<\/td><td class=\"m\">yia-TI<\/td><td class=\"\">por qué (y porque)<\/td><\/tr><\/tbody><\/table><\/div>", "ejx": [["___ είναι η τουαλέτα; (dónde)", "πού"], ["___ κάνει; (cuánto)", "πόσο"], ["___ ώρα φεύγει; (qué)", "τι"], ["___ σε λένε; (cómo)", "πώς"]], "lvl": "A1"}, {"id": "gr-pronouns", "sec": "gramatica", "k": "regla", "t": "Los pronombres", "es": "Εγώ, εσύ… y με, σε…", "uso": "Los pronombres sujeto se omiten salvo para dar énfasis. Los de objeto son cortos y van delante del verbo, como «me», «te», «le» en español.", "ej": [["Με πονάει.", "Me duele.", "Me ponái."], ["Μου έκλεψαν το κινητό.", "Me robaron el móvil.", "Mu éklepsan to kinitó."], ["Σας ευχαριστώ.", "Se lo agradezco.", "Sas efcharistó."]], "rel": ["gr-ponaei", "gr-me-lene", "gr-possessives", "gr-formal", "gr-astynomia", "gr-einai"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Español<\/th><th>Sujeto<\/th><th>Objeto directo<\/th><th>Objeto indirecto<\/th><\/tr><\/thead><tbody><tr><td class=\"\">yo<\/td><td class=\"g\">εγώ<\/td><td class=\"g\">με<\/td><td class=\"g\">μου<\/td><\/tr><tr><td class=\"\">tú<\/td><td class=\"g\">εσύ<\/td><td class=\"g\">σε<\/td><td class=\"g\">σου<\/td><\/tr><tr><td class=\"\">él / ella / ello<\/td><td class=\"g\">αυτός / αυτή / αυτό<\/td><td class=\"g\">τον / την / το<\/td><td class=\"g\">του / της / του<\/td><\/tr><tr><td class=\"\">nosotros<\/td><td class=\"g\">εμείς<\/td><td class=\"g\">μας<\/td><td class=\"g\">μας<\/td><\/tr><tr><td class=\"\">vosotros / usted<\/td><td class=\"g\">εσείς<\/td><td class=\"g\">σας<\/td><td class=\"g\">σας<\/td><\/tr><tr><td class=\"\">ellos / ellas<\/td><td class=\"g\">αυτοί / αυτές / αυτά<\/td><td class=\"g\">τους / τις / τα<\/td><td class=\"g\">τους<\/td><\/tr><\/tbody><\/table><\/div>", "ejx": [["___ πονάει εδώ. (me)", "με"], ["___ έκλεψαν το κινητό. (a mí)", "μου"], ["___ ευχαριστώ. (a usted)", "σας"]], "lvl": "A1"}, {"id": "gr-possessives", "sec": "gramatica", "k": "regla", "t": "Los posesivos", "es": "Van detrás del nombre", "uso": "«Mi maleta» se dice «la maleta mía»: artículo + nombre + μου. Son las mismas formas que el objeto indirecto (μου, σου, του, της, μας, σας, τους). Si el nombre lleva el acento en la antepenúltima sílaba, gana un segundo acento: το διαβατήριό μου.", "ej": [["η βαλίτσα μου", "mi maleta", "i valítsa mu"], ["το διαβατήριό σας", "su pasaporte (de usted)", "to diavatírió sas"], ["ο φίλος μου", "mi amigo", "o fílos mu"]], "rel": ["gr-valitsa", "gr-diavatirio", "gr-yamas", "gr-pronouns", "gr-astynomia", "gr-pron-stress"], "lvl": "A2", "truco": "Al revés que en español: primero la cosa, luego de quién es. η βαλίτσα μου = «la maleta mía».", "err": [["μου βαλίτσα", "η βαλίτσα μου", "El posesivo va detrás y el nombre lleva artículo."]], "ejx": [["η βαλίτσα ___ (mi)", "μου"], ["το διαβατήριό ___ (su, de usted)", "σας"], ["ο φίλος ___ (de ella)", "της"]]}, {"id": "gr-formal", "sec": "gramatica", "k": "regla", "t": "Tú y usted: εσύ / εσείς", "es": "El trato formal es el plural", "uso": "El griego trata de usted con la segunda persona del plural, como el «vous» francés: «Τι κάνετε;», «Γεια σας», «Μιλάτε…;». Úsalo con desconocidos, en tiendas y oficinas. Entre gente joven y en ambientes relajados se tutea enseguida.", "ej": [["Τι κάνετε;", "¿Qué tal está usted?", "Ti kánete?"], ["Μπορείτε να με βοηθήσετε;", "¿Me puede ayudar?", "Boríte na me voithísete?"]], "rel": ["gr-geia", "gr-ti-kaneis", "gr-milate", "gr-pronouns", "gr-boro-na"], "ejx": [["Τι ___ ; (κάνω, usted)", "κάνετε"], ["Γεια ___ ! (formal)", "σας"]], "lvl": "A1"}, {"id": "gr-plural", "sec": "gramatica", "k": "regla", "t": "El plural", "es": "Cambia la terminación", "uso": "La terminación cambia según el tipo de nombre. El artículo también: ο/η → οι, το → τα.", "ej": [["δύο εισιτήρια", "dos billetes"], ["τρεις βαλίτσες", "tres maletas"]], "rel": ["gr-articles", "gr-domatio", "gr-eisitirio", "gr-kleidi", "gr-gender", "gr-valitsa"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Singular<\/th><th>Plural<\/th><th>Regla<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">ο δρόμος<\/td><td class=\"g\">οι δρόμοι<\/td><td class=\"m\">-ος → -οι<\/td><\/tr><tr><td class=\"g\">ο καφές<\/td><td class=\"g\">οι καφέδες<\/td><td class=\"m\">-ές → -έδες<\/td><\/tr><tr><td class=\"g\">η βαλίτσα<\/td><td class=\"g\">οι βαλίτσες<\/td><td class=\"m\">-α → -ες<\/td><\/tr><tr><td class=\"g\">η στάση<\/td><td class=\"g\">οι στάσεις<\/td><td class=\"m\">-η → -εις<\/td><\/tr><tr><td class=\"g\">το νερό<\/td><td class=\"g\">τα νερά<\/td><td class=\"m\">-ο → -α<\/td><\/tr><tr><td class=\"g\">το κλειδί<\/td><td class=\"g\">τα κλειδιά<\/td><td class=\"m\">-ι → -ιά<\/td><\/tr><tr><td class=\"g\">το εισιτήριο<\/td><td class=\"g\">τα εισιτήρια<\/td><td class=\"m\">-ιο → -ια<\/td><\/tr><tr><td class=\"g\">το όνομα<\/td><td class=\"g\">τα ονόματα<\/td><td class=\"m\">-μα → -ματα<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "ejx": [["ο δρόμος → οι ___", "δρόμοι"], ["η βαλίτσα → οι ___", "βαλίτσες"], ["το εισιτήριο → τα ___", "εισιτήρια"], ["το κλειδί → τα ___", "κλειδιά"]]}, {"id": "gr-adjectives", "sec": "gramatica", "k": "regla", "t": "Los adjetivos", "es": "Concuerdan y van delante", "uso": "El adjetivo suele ir delante del nombre y toma su género, número y caso: -ος (masculino), -η o -α (femenino), -ο (neutro). Para comparar se pone «πιο» (más) delante.", "ej": [["καλή μέρα → καλημέρα", "buen día"], ["κρύα μπίρα", "cerveza fría"], ["πιο φτηνό", "más barato"], ["το πιο κοντινό", "el más cercano"]], "rel": ["gr-kalimera", "gr-oraia", "gr-nostimo", "gr-akrivo", "gr-gender", "gr-presveia"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Masculino<\/th><th>Femenino<\/th><th>Neutro<\/th><th>Español<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">καλός<\/td><td class=\"g\">καλή<\/td><td class=\"g\">καλό<\/td><td class=\"\">bueno<\/td><\/tr><tr><td class=\"g\">ωραίος<\/td><td class=\"g\">ωραία<\/td><td class=\"g\">ωραίο<\/td><td class=\"\">bonito<\/td><\/tr><tr><td class=\"g\">ακριβός<\/td><td class=\"g\">ακριβή<\/td><td class=\"g\">ακριβό<\/td><td class=\"\">caro<\/td><\/tr><tr><td class=\"g\">κρύος<\/td><td class=\"g\">κρύα<\/td><td class=\"g\">κρύο<\/td><td class=\"\">frío<\/td><\/tr><tr><td class=\"g\">ζεστός<\/td><td class=\"g\">ζεστή<\/td><td class=\"g\">ζεστό<\/td><td class=\"\">caliente<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "ejx": [["μια ___ μπίρα (κρύος, fría)", "κρύα"], ["ένα ___ δωμάτιο (ωραίος, bonito)", "ωραίο"], ["πιο ___ (más barato, neutro)", "φτηνό"]]}, {"id": "gr-thelo-na", "sec": "gramatica", "k": "regla", "t": "Θέλω να + verbo", "es": "«Quiero ir» = «quiero que vaya»", "uso": "Como no hay infinitivo, «quiero ir» se dice «θέλω να πάω» (quiero que vaya). La misma construcción va después de μπορώ (poder) y πρέπει (hay que). La forma que va tras «να» se aprende mejor en bloque, con la frase hecha.", "ej": [["Θέλω να πάω στην Ακρόπολη.", "Quiero ir a la Acrópolis.", "Thélo na páo stin Akrópoli."], ["Πρέπει να αλλάξω;", "¿Tengo que hacer transbordo?", "Prépi na alláxo?"]], "rel": ["gr-boro-na", "gr-enoikiasi", "gr-tha-ithela", "gr-verbs-present", "gr-negation"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Se pronuncia<\/th><th>Español<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">να πάω<\/td><td class=\"m\">na PA-o<\/td><td class=\"\">ir<\/td><\/tr><tr><td class=\"g\">να αγοράσω<\/td><td class=\"m\">na a-go-RA-so<\/td><td class=\"\">comprar<\/td><\/tr><tr><td class=\"g\">να πληρώσω<\/td><td class=\"m\">na pli-RO-so<\/td><td class=\"\">pagar<\/td><\/tr><tr><td class=\"g\">να φάω<\/td><td class=\"m\">na FA-o<\/td><td class=\"\">comer<\/td><\/tr><tr><td class=\"g\">να πιω<\/td><td class=\"m\">na pio<\/td><td class=\"\">beber<\/td><\/tr><tr><td class=\"g\">να κλείσω<\/td><td class=\"m\">na KLI-so<\/td><td class=\"\">reservar (y cerrar)<\/td><\/tr><tr><td class=\"g\">να νοικιάσω<\/td><td class=\"m\">na ni-KIA-so<\/td><td class=\"\">alquilar<\/td><\/tr><tr><td class=\"g\">να δω<\/td><td class=\"m\">na dho<\/td><td class=\"\">ver<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "truco": "Θέλω να… = «quiero que…». Si lo piensas así en español, nunca olvidas el «να».", "err": [["Θέλω πάω.", "Θέλω να πάω.", "Sin «να» no funciona: el griego no tiene infinitivo."]], "ejx": [["Θέλω ___ πάω στην Ακρόπολη.", "να"], ["Μπορώ να ___ με κάρτα; (pagar)", "πληρώσω"], ["Θέλω να ___ ένα αυτοκίνητο. (alquilar)", "νοικιάσω"]]}, {"id": "gr-boro-na", "sec": "gramatica", "k": "regla", "t": "Μπορώ να…", "es": "¿Puedo…? / ¿Puede…?", "uso": "«Μπορώ να» + verbo = puedo. Para pedir algo a otra persona de forma educada: «Μπορείτε να…;» (¿puede usted…?).", "ej": [["Μπορώ να πληρώσω με κάρτα;", "¿Puedo pagar con tarjeta?", "Boró na pliróso me kárta?"], ["Μπορείτε να με βοηθήσετε;", "¿Me puede ayudar?", "Boríte na me voithísete?"], ["Μπορείτε να μας βγάλετε μια φωτογραφία;", "¿Nos puede hacer una foto?", "Boríte na mas vgálete mia fotografía?"]], "rel": ["gr-karta", "gr-chathika", "gr-kleidi", "gr-thelo-na", "gr-pron-mp-nt", "gr-formal"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Persona<\/th><th>μπορώ<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"\">yo<\/td><td class=\"g\">μπορώ<\/td><td class=\"m\">bo-RO<\/td><\/tr><tr><td class=\"\">tú<\/td><td class=\"g\">μπορείς<\/td><td class=\"m\">bo-RIS<\/td><\/tr><tr><td class=\"\">él, ella<\/td><td class=\"g\">μπορεί<\/td><td class=\"m\">bo-RI<\/td><\/tr><tr><td class=\"\">nosotros<\/td><td class=\"g\">μπορούμε<\/td><td class=\"m\">bo-RU-me<\/td><\/tr><tr><td class=\"\">vosotros / usted<\/td><td class=\"g\">μπορείτε<\/td><td class=\"m\">bo-RI-te<\/td><\/tr><tr><td class=\"\">ellos<\/td><td class=\"g\">μπορούν<\/td><td class=\"m\">bo-RUN<\/td><\/tr><\/tbody><\/table><\/div>", "ejx": [["___ να πληρώσω με κάρτα; (yo)", "μπορώ"], ["___ να με βοηθήσετε; (usted)", "μπορείτε"], ["___ να καθίσουμε έξω; (nosotros)", "μπορούμε"]], "lvl": "A1"}, {"id": "gr-future", "sec": "gramatica", "k": "regla", "t": "El futuro con θα", "es": "Θα + verbo", "uso": "«Θα» delante del verbo forma el futuro: θα πάω (iré). Con el imperfecto forma el condicional de cortesía: θα ήθελα (quisiera).", "ej": [["Θα πάρω τον μουσακά.", "Tomaré la musaca.", "Tha páro ton musaká."], ["Θα έρθω αύριο.", "Vendré mañana.", "Tha értho ávrio."], ["Πόσο θα κοστίσει;", "¿Cuánto costará?", "Póso tha kostísi?"]], "rel": ["gr-tha-ithela", "gr-taxi", "gr-thelo-na"], "lvl": "A2", "ejx": [["___ πάω αύριο. (iré)", "θα"], ["___ ήθελα ένα νερό. (quisiera)", "θα"]]}, {"id": "gr-past", "sec": "gramatica", "k": "regla", "t": "El pasado (aoristo)", "es": "Lo que ya pasó", "uso": "Para acciones terminadas. Muchos verbos añaden una έ- al principio cuando hace falta una sílaba más para el acento: χάνω → έχασα (perdí). Terminaciones: -α, -ες, -ε, -αμε, -ατε, -αν.", "ej": [["Έχασα το κλειδί.", "He perdido la llave.", "Échasa to klidí."], ["Ήταν πολύ νόστιμο.", "Estaba muy rico.", "Ítan polí nóstimo."]], "nota": "El griego usa este pasado donde en español decimos «he perdido»: «Έχασα το διαβατήριο» = he perdido el pasaporte.", "rel": ["gr-astynomia", "gr-chathika", "gr-valitsa", "gr-nostimo", "gr-kathysterisi"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Presente<\/th><th>Pasado (yo)<\/th><th>Español<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">χάνω<\/td><td class=\"g\">έχασα<\/td><td class=\"\">perdí<\/td><\/tr><tr><td class=\"g\">κλέβω<\/td><td class=\"g\">έκλεψα<\/td><td class=\"\">robé<\/td><\/tr><tr><td class=\"g\">έρχομαι<\/td><td class=\"g\">ήρθα<\/td><td class=\"\">vine, llegué<\/td><\/tr><tr><td class=\"g\">πάω<\/td><td class=\"g\">πήγα<\/td><td class=\"\">fui<\/td><\/tr><tr><td class=\"g\">φτάνω<\/td><td class=\"g\">έφτασα<\/td><td class=\"\">llegué<\/td><\/tr><tr><td class=\"g\">τρώω<\/td><td class=\"g\">έφαγα<\/td><td class=\"\">comí<\/td><\/tr><tr><td class=\"g\">πληρώνω<\/td><td class=\"g\">πλήρωσα<\/td><td class=\"\">pagué<\/td><\/tr><tr><td class=\"g\">χάνομαι<\/td><td class=\"g\">χάθηκα<\/td><td class=\"\">me perdí<\/td><\/tr><tr><td class=\"g\">είμαι<\/td><td class=\"g\">ήμουν<\/td><td class=\"\">fui, estuve<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "ejx": [["χάνω → ___ (perdí)", "έχασα"], ["πάω → ___ (fui)", "πήγα"], ["τρώω → ___ (comí)", "έφαγα"]]}, {"id": "gr-prepositions", "sec": "gramatica", "k": "regla", "t": "Preposiciones: σε, από, με, για", "es": "Van con acusativo", "uso": "Las cuatro más útiles van seguidas de acusativo. «Σε» (a, en) se une al artículo: σε + το = στο, σε + τη(ν) = στη(ν), σε + τον = στον, σε + τους = στους, σε + τις = στις.", "ej": [["στο ξενοδοχείο", "en el hotel / al hotel", "sto xenodochío"], ["στις πέντε", "a las cinco", "stis pénde"]], "rel": ["gr-me-lene", "gr-taxi", "gr-allergia", "gr-eisitirio", "gr-cases", "gr-ora", "gr-kratisi", "gr-karta"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Preposición<\/th><th>Significa<\/th><th>Ejemplo<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">σε<\/td><td class=\"\">a, en<\/td><td class=\"\">στο λιμάνι — en el puerto<\/td><\/tr><tr><td class=\"g\">από<\/td><td class=\"\">de, desde<\/td><td class=\"\">από την Ισπανία — de España<\/td><\/tr><tr><td class=\"g\">με<\/td><td class=\"\">con, en (transporte, pago)<\/td><td class=\"\">με το λεωφορείο — en autobús; με κάρτα — con tarjeta<\/td><\/tr><tr><td class=\"g\">για<\/td><td class=\"\">para, por, hacia<\/td><td class=\"\">για δύο — para dos; για Αθήνα — hacia Atenas<\/td><\/tr><\/tbody><\/table><\/div>", "truco": "σε + artículo se funde: στο, στη, στον, στις. Como «a + el = al».", "ejx": [["σε + το λιμάνι = ___ λιμάνι", "στο"], ["σε + τις πέντε = ___ πέντε", "στις"], ["Είμαι ___ την Ισπανία. (de)", "από"], ["Πληρώνω ___ κάρτα. (con)", "με"]], "lvl": "A1"}, {"id": "gr-imperative", "sec": "gramatica", "k": "regla", "t": "Órdenes útiles", "es": "El imperativo formal", "uso": "Las formas formales o de plural acaban en -τε o -ετε. Las oirás en indicaciones y las necesitarás en emergencias.", "ej": [["Καλέστε ασθενοφόρο!", "¡Llamen a una ambulancia!", "Kaléste asthenofóro!"], ["Περιμένετε εδώ.", "Espere aquí.", "Periménete edó."]], "rel": ["gr-aristera", "gr-voitheia", "gr-taxi"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Griego<\/th><th>Español<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Καλέστε<\/td><td class=\"\">llamen<\/td><\/tr><tr><td class=\"g\">Περιμένετε<\/td><td class=\"\">espere<\/td><\/tr><tr><td class=\"g\">Στρίψτε<\/td><td class=\"\">gire<\/td><\/tr><tr><td class=\"g\">Πάτε<\/td><td class=\"\">vaya<\/td><\/tr><tr><td class=\"g\">Ελάτε<\/td><td class=\"\">venga<\/td><\/tr><tr><td class=\"g\">Σταματήστε<\/td><td class=\"\">pare<\/td><\/tr><\/tbody><\/table><\/div>", "lvl": "A2", "ejx": [["¡Llamen a la policía! → ___ την αστυνομία!", "καλέστε"], ["Espere aquí → ___ εδώ.", "περιμένετε"]]}, {"id": "gr-alfabeto", "sec": "alfabeto", "k": "tabla", "t": "Το αλφάβητο", "tr": "To alfávito", "es": "El alfabeto griego", "uso": "24 letras. Muchas se parecen a las nuestras y suenan igual; las peligrosas son las que parecen latinas pero suenan distinto: Η es i, Ρ es r, Ν es n, Χ es j, Υ es i, Β es v.", "pr": "AL-fa, VI-ta, GA-ma…", "nota": "La σ se escribe ς cuando es la última letra de la palabra: σας, καφές.", "rel": ["gr-pron-vowels", "gr-pron-th", "gr-pron-gamma", "gr-pron-chi", "gr-pron-stress", "gr-pron-mp-nt", "gr-pron-s"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Letra<\/th><th>Nombre<\/th><th>Suena<\/th><th>Como en<\/th><\/tr><\/thead><tbody><tr><td class=\"g\">Α α<\/td><td class=\"\">άλφα<\/td><td class=\"m\">a<\/td><td class=\"\">casa<\/td><\/tr><tr><td class=\"g\">Β β<\/td><td class=\"\">βήτα<\/td><td class=\"m\">v<\/td><td class=\"\">la v francesa (labio y dientes), no b<\/td><\/tr><tr><td class=\"g\">Γ γ<\/td><td class=\"\">γάμμα<\/td><td class=\"m\">g suave / y<\/td><td class=\"\">lago; ante e, i como «yo»<\/td><\/tr><tr><td class=\"g\">Δ δ<\/td><td class=\"\">δέλτα<\/td><td class=\"m\">dh<\/td><td class=\"\">la d suave de «nada»<\/td><\/tr><tr><td class=\"g\">Ε ε<\/td><td class=\"\">έψιλον<\/td><td class=\"m\">e<\/td><td class=\"\">mesa<\/td><\/tr><tr><td class=\"g\">Ζ ζ<\/td><td class=\"\">ζήτα<\/td><td class=\"m\">z<\/td><td class=\"\">s sonora, como en «mismo»<\/td><\/tr><tr><td class=\"g\">Η η<\/td><td class=\"\">ήτα<\/td><td class=\"m\">i<\/td><td class=\"\">isla<\/td><\/tr><tr><td class=\"g\">Θ θ<\/td><td class=\"\">θήτα<\/td><td class=\"m\">th<\/td><td class=\"\">la z castellana de «zapato»<\/td><\/tr><tr><td class=\"g\">Ι ι<\/td><td class=\"\">γιώτα<\/td><td class=\"m\">i<\/td><td class=\"\">isla<\/td><\/tr><tr><td class=\"g\">Κ κ<\/td><td class=\"\">κάπα<\/td><td class=\"m\">k<\/td><td class=\"\">casa<\/td><\/tr><tr><td class=\"g\">Λ λ<\/td><td class=\"\">λάμδα<\/td><td class=\"m\">l<\/td><td class=\"\">lado<\/td><\/tr><tr><td class=\"g\">Μ μ<\/td><td class=\"\">μι<\/td><td class=\"m\">m<\/td><td class=\"\">mano<\/td><\/tr><tr><td class=\"g\">Ν ν<\/td><td class=\"\">νι<\/td><td class=\"m\">n<\/td><td class=\"\">nada<\/td><\/tr><tr><td class=\"g\">Ξ ξ<\/td><td class=\"\">ξι<\/td><td class=\"m\">ks<\/td><td class=\"\">taxi<\/td><\/tr><tr><td class=\"g\">Ο ο<\/td><td class=\"\">όμικρον<\/td><td class=\"m\">o<\/td><td class=\"\">ojo<\/td><\/tr><tr><td class=\"g\">Π π<\/td><td class=\"\">πι<\/td><td class=\"m\">p<\/td><td class=\"\">pan<\/td><\/tr><tr><td class=\"g\">Ρ ρ<\/td><td class=\"\">ρο<\/td><td class=\"m\">r<\/td><td class=\"\">la r simple de «caro»<\/td><\/tr><tr><td class=\"g\">Σ σ ς<\/td><td class=\"\">σίγμα<\/td><td class=\"m\">s<\/td><td class=\"\">sol (z ante β, γ, δ, μ)<\/td><\/tr><tr><td class=\"g\">Τ τ<\/td><td class=\"\">ταυ<\/td><td class=\"m\">t<\/td><td class=\"\">té<\/td><\/tr><tr><td class=\"g\">Υ υ<\/td><td class=\"\">ύψιλον<\/td><td class=\"m\">i<\/td><td class=\"\">isla<\/td><\/tr><tr><td class=\"g\">Φ φ<\/td><td class=\"\">φι<\/td><td class=\"m\">f<\/td><td class=\"\">foca<\/td><\/tr><tr><td class=\"g\">Χ χ<\/td><td class=\"\">χι<\/td><td class=\"m\">j<\/td><td class=\"\">jamón<\/td><\/tr><tr><td class=\"g\">Ψ ψ<\/td><td class=\"\">ψι<\/td><td class=\"m\">ps<\/td><td class=\"\">cápsula<\/td><\/tr><tr><td class=\"g\">Ω ω<\/td><td class=\"\">ωμέγα<\/td><td class=\"m\">o<\/td><td class=\"\">ojo<\/td><\/tr><\/tbody><\/table><\/div>", "say": "άλφα, βήτα, γάμμα, δέλτα, έψιλον, ζήτα, ήτα, θήτα, γιώτα, κάπα, λάμδα, μι, νι, ξι, όμικρον, πι, ρο, σίγμα, ταυ, ύψιλον, φι, χι, ψι, ωμέγα", "truco": "Las trampas son las que parecen latinas: Η = i, Ρ = r, Υ = i, Χ = j, Β = v, Ν = n.", "lvl": "A1"}, {"id": "gr-pron-vowels", "sec": "alfabeto", "k": "sonido", "t": "Cinco vocales, muchas letras", "es": "Las vocales suenan como en español", "uso": "Solo hay cinco sonidos vocálicos, los mismos que en español, siempre cortos y claros. El lío está en la escritura: la i se escribe de seis maneras, la e de dos, la o de dos y la u siempre con dos letras.", "pr": "i, e, o, u", "ej": [["ει, οι, η, υ, ι", "todas suenan i", "kleidí, kitázo, i, ítan"], ["αι", "suena e", "katalavéno"], ["ου", "suena u", "pu, nerú"]], "rel": ["gr-alfabeto", "gr-pron-stress", "gr-kleidi", "gr-den-katalaveno", "gr-mono-koitazo", "gr-nai-ochi"], "body": "<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Sonido<\/th><th>Se escribe<\/th><th>Ejemplo<\/th><\/tr><\/thead><tbody><tr><td class=\"m\">a<\/td><td class=\"g\">α<\/td><td class=\"\">καφές<\/td><\/tr><tr><td class=\"m\">e<\/td><td class=\"g\">ε, αι<\/td><td class=\"\">ναι (ne), και (ke)<\/td><\/tr><tr><td class=\"m\">i<\/td><td class=\"g\">ι, η, υ, ει, οι, υι<\/td><td class=\"\">κλειδί, οι, ήταν<\/td><\/tr><tr><td class=\"m\">o<\/td><td class=\"g\">ο, ω<\/td><td class=\"\">νερό, ώρα<\/td><\/tr><tr><td class=\"m\">u<\/td><td class=\"g\">ου<\/td><td class=\"\">πού, ούζο<\/td><\/tr><\/tbody><\/table><\/div>", "say": "ναι, και, κλειδί, πού, ώρα", "truco": "Dos vocales con ι detrás (ει, οι, υι) suenan i. αι suena e. ου suena u.", "lvl": "A1"}, {"id": "gr-pron-stress", "sec": "alfabeto", "k": "sonido", "t": "El acento (τόνος)", "es": "Se pronuncia donde está la tilde", "uso": "Toda palabra de más de una sílaba lleva tilde (´) en la vocal tónica, así que nunca hay dudas. Cambiar el acento puede cambiar el significado. En textos escritos todo en mayúsculas (carteles) la tilde no se pone.", "pr": "PO-te / po-TE", "ej": [["πότε / ποτέ", "cuándo / nunca", "póte / poté"], ["πού / που", "dónde / que", "pu / pu"]], "nota": "La diéresis (¨) separa dos vocales que normalmente irían juntas: κοροϊδεύω (ko-ro-i-DHE-vo), «tomar el pelo».", "rel": ["gr-pron-vowels", "gr-possessives", "gr-pou-einai"], "say": "πότε, ποτέ", "lvl": "A1"}, {"id": "gr-pron-th", "sec": "alfabeto", "k": "sonido", "t": "θ y δ", "tr": "θ /θ/, δ /ð/", "es": "La z castellana y la d suave", "uso": "<b>θ<\/b> suena como la z de «zapato» en castellano, con la lengua entre los dientes: θέλω (THE-lo). <b>δ<\/b> suena como la d suave de «nada» o el th inglés de «this», también en principio de palabra: δέκα (DHE-ka). En las fichas se escriben <b>th<\/b> y <b>dh<\/b>.", "pr": "THE-lo / DHE-ka", "ej": [["θάλασσα", "mar", "thálassa"], ["δρόμος", "calle", "drómos"]], "nota": "Si en tu habla seseas, coloca la punta de la lengua entre los dientes y sopla.", "rel": ["gr-alfabeto", "gr-kathysterisi", "gr-voitheia", "gr-aristera"], "say": "θέλω, δέκα, θάλασσα, δρόμος", "lvl": "A1"}, {"id": "gr-pron-gamma", "sec": "alfabeto", "k": "sonido", "t": "γ", "es": "Dos sonidos según la vocal", "uso": "Ante sonido e o i (ε, αι, ι, η, υ, ει, οι) suena como la y de «yo»: γεια (ya), γιατρός (ya-TROS). En el resto de casos es una g suave, sin cerrar del todo, como la de «lago»: γάλα (GA-la).", "pr": "YA / GA-la", "ej": [["γεια σας", "hola", "yia sas"], ["γάλα", "leche", "gála"], ["γυναίκα", "mujer", "yinéka"]], "rel": ["gr-geia", "gr-pote-fevgei", "gr-giatros", "gr-pron-gk", "gr-alfabeto"], "say": "γεια, γάλα, γιατρός", "lvl": "A1"}, {"id": "gr-pron-chi", "sec": "alfabeto", "k": "sonido", "t": "χ", "es": "Como la jota", "uso": "Suena como la j española: χάρτης (JAR-tis). Ante e o i se suaviza un poco, como la ch alemana de «ich»: χέρι (JE-ri).", "pr": "JAR-tis", "ej": [["χάρτης", "mapa", "chártis"], ["όχι", "no", "óchi"], ["ευχαριστώ", "gracias", "efcharistó"]], "nota": "En la transliteración latina se escribe «ch» (Cháthika), pero se lee como j.", "rel": ["gr-kalimera", "gr-chathika", "gr-chortofagos", "gr-efcharisto", "gr-alfabeto"], "say": "χάρτης, όχι, ευχαριστώ", "lvl": "A1"}, {"id": "gr-pron-mp-nt", "sec": "alfabeto", "k": "sonido", "t": "μπ y ντ", "es": "Así se escriben la b y la d", "uso": "El griego no tiene letra para la b ni para la d «duras» del español: usa μπ y ντ. Al principio de palabra suenan b y d (μπίρα, BI-ra; ντομάτα, do-MA-ta). En medio suenan mb y nd, o solo b y d (εντάξει, en-DAK-si).", "pr": "BI-ra / do-MA-ta", "ej": [["μπίρα", "cerveza", "bíra"], ["ντομάτα", "tomate", "domáta"], ["εντάξει", "vale", "entáxi"]], "rel": ["gr-entaxei", "gr-nero", "gr-boro-na", "gr-konta", "gr-antio", "gr-den-doulevei"], "say": "μπίρα, ντομάτα, εντάξει", "truco": "Para escribir «bar» en griego hace falta μπ: μπαρ.", "lvl": "A1"}, {"id": "gr-pron-gk", "sec": "alfabeto", "k": "sonido", "t": "γκ y γγ", "es": "La g dura", "uso": "γκ al principio de palabra suena como la g de «gato» (γκαράζ, ga-RAZ). En medio suena ng o g (Αγγλία, an-GLI-a). γγ siempre suena ng o g.", "pr": "an-GLI-a", "ej": [["Αγγλία", "Inglaterra", "Anglía"], ["συγγνώμη", "perdón", "signómi"]], "rel": ["gr-signomi", "gr-milate", "gr-pron-gamma"], "say": "Αγγλία, συγγνώμη", "lvl": "A1"}, {"id": "gr-pron-av-ev", "sec": "alfabeto", "k": "sonido", "t": "αυ y ευ", "es": "No son diptongos", "uso": "La υ se convierte en consonante. Suenan <b>av / ev<\/b> delante de vocal o de consonante sonora, y <b>af / ef<\/b> delante de consonante sorda (θ, κ, ξ, π, σ, τ, φ, χ, ψ).", "pr": "ef-ja-ris-TO / ev-RO", "ej": [["ευχαριστώ", "gracias", "efcharistó"], ["ευρώ", "euro", "evró"], ["αυτοκίνητο", "coche", "aftokínito"], ["Αύγουστος", "agosto", "Ávgustos"]], "rel": ["gr-efcharisto", "gr-diavatirio", "gr-enoikiasi", "gr-pote-fevgei", "gr-aristera"], "say": "ευχαριστώ, ευρώ, αυτοκίνητο", "lvl": "A1"}, {"id": "gr-pron-ts", "sec": "alfabeto", "k": "sonido", "t": "τσ y τζ", "es": "ts y dz", "uso": "τσ suena ts, como en «tsé-tsé»: βαλίτσα (va-LI-tsa). τζ suena dz, con zumbido: τζατζίκι (dza-DZI-ki).", "pr": "va-LI-tsa / dza-DZI-ki", "ej": [["βαλίτσα", "maleta", "valítsa"], ["τζατζίκι", "tzatziki", "tzatzíki"], ["πετσέτα", "toalla", "petséta"]], "rel": ["gr-valitsa", "gr-kleidi"], "say": "βαλίτσα, τζατζίκι", "lvl": "A1"}, {"id": "gr-pron-s", "sec": "alfabeto", "k": "sonido", "t": "σ que suena z", "es": "Ante consonante sonora", "uso": "Delante de β, γ, δ, μ, ν o ρ la σ se sonoriza y suena como una z (s zumbada), igual que la s de «mismo» en español: κόσμος (KOZ-mos), λογαριασμός (lo-ga-riaz-MOS).", "pr": "KOZ-mos", "ej": [["κόσμος", "gente, mundo", "kósmos"], ["πρεσβεία", "embajada", "presvía"]], "rel": ["gr-logariasmo", "gr-presveia", "gr-alfabeto"], "say": "κόσμος, λογαριασμός", "lvl": "A1"}, {"id": "gr-douleuo", "sec": "charla", "k": "frase", "t": "Τι δουλειά κάνεις; — Είμαι προγραμματιστής", "tr": "Ti douliá kánis? — Íme programmatistís", "es": "¿A qué te dedicas? — Soy programador", "uso": "Pregunta habitual tras el nombre y el país. Las profesiones van sin artículo: «Είμαι γιατρός» (soy médico).", "pr": "ti dhu-LIA KA-nis — I-me pro-gra-ma-tis-TIS", "ej": [["Δουλεύω σε μια εταιρεία πληροφορικής.", "Trabajo en una empresa de informática.", "Doulévo se mia etería pliroforikís."]], "rel": ["gr-einai", "gr-verbs-present", "gr-me-lene"], "lvl": "A1"}, {"id": "gr-proti-fora", "sec": "charla", "k": "frase", "t": "Είναι η πρώτη μου φορά στην Ελλάδα", "tr": "Íne i próti mu forá stin Elláda", "es": "Es mi primera vez en Grecia", "uso": "Respuesta a «Πρώτη φορά στην Ελλάδα;» (¿primera vez en Grecia?), que te preguntarán a menudo.", "pr": "I-ne i PRO-ti mu fo-RA stin e-LA-dha", "ej": [["Όχι, ήρθα και πέρσι.", "No, vine también el año pasado.", "Óchi, írtha ke pérsi."]], "rel": ["gr-possessives", "gr-prepositions", "gr-past"], "lvl": "A1"}, {"id": "gr-mou-aresei", "sec": "charla", "k": "frase", "t": "Μου αρέσει πολύ", "tr": "Mu arési polí", "es": "Me gusta mucho", "uso": "Funciona exactamente como «gustar» en español: lo que gusta es el sujeto. Si es plural: «μου αρέσουν».", "pr": "mu a-RE-si po-LI", "ej": [["Μου αρέσει πολύ η Ελλάδα!", "¡Me gusta mucho Grecia!", "Mu arési polí i Elláda!"], ["Μου αρέσουν τα νησιά.", "Me gustan las islas.", "Mu arésun ta nisiá."], ["Δεν μου αρέσει το ούζο.", "No me gusta el ouzo.", "Den mu arési to úzo."]], "rel": ["gr-pronouns", "gr-negation"], "lvl": "A1"}, {"id": "gr-kairos", "sec": "charla", "k": "frase", "t": "Κάνει ζέστη / κρύο", "tr": "Káni zésti / krío", "es": "Hace calor / frío", "uso": "El tiempo: «Τι καιρό κάνει;» (¿qué tiempo hace?), «βρέχει» (llueve), «έχει αέρα» (hace viento), «έχει ήλιο» (hace sol).", "pr": "KA-ni ZES-ti / KRI-o", "ej": [["Τι καιρό θα κάνει αύριο;", "¿Qué tiempo hará mañana?", "Ti keró tha káni ávrio?"], ["Έχει πολύ αέρα σήμερα.", "Hoy hace mucho viento.", "Échi polí aéra símera."]], "nota": "En julio y agosto sopla el meltemi (μελτέμι) en el Egeo: un viento del norte fuerte que a veces retrasa o cancela ferris pequeños.", "rel": ["gr-verbs-present", "gr-ploio", "gr-future"], "lvl": "A1"}, {"id": "gr-chronon", "sec": "charla", "k": "frase", "t": "Είμαι τριάντα χρονών", "tr": "Íme triánda chronón", "es": "Tengo treinta años", "uso": "Como en inglés, la edad va con «ser». Pregunta: «Πόσων χρονών είσαι;».", "pr": "I-me TRIAN-da jro-NON", "ej": [["Πόσων χρονών είσαι;", "¿Cuántos años tienes?", "Póson chronón íse?"]], "nota": "«Έχω τριάντα χρόνια» no se usa para la edad.", "rel": ["gr-einai", "gr-numbers"], "lvl": "A1"}, {"id": "gr-me-poion", "sec": "charla", "k": "frase", "t": "Είμαι εδώ με τη σύντροφό μου", "tr": "Íme edó me ti síntrofó mu", "es": "Estoy aquí con mi pareja", "uso": "Otros: με τον άντρα μου (con mi marido), με τη γυναίκα μου (con mi mujer), με φίλους (con amigos), μόνος / μόνη (solo / sola).", "pr": "I-me e-DHO me ti SIN-dro-FO mu", "ej": [["Ταξιδεύω μόνος.", "Viajo solo.", "Taxidévo mónos."]], "rel": ["gr-possessives", "gr-einai"], "lvl": "A1"}, {"id": "gr-kalo-taxidi", "sec": "charla", "k": "frase", "t": "Καλό ταξίδι! / Καλή όρεξη! / Καλές διακοπές!", "tr": "Kaló taxídi! / Kalí órexi! / Kalés diakopés!", "es": "¡Buen viaje! / ¡Buen provecho! / ¡Felices vacaciones!", "uso": "Los griegos desean «καλό» o «καλή» para casi todo: Καλή εβδομάδα (buena semana, el lunes), Καλό μήνα (buen mes, el día 1), Καλό βράδυ (buena tarde-noche).", "pr": "ka-LO tak-SI-dhi / ka-LI O-rek-si / ka-LES dhia-ko-PES", "ej": [["Καλή εβδομάδα!", "¡Buena semana!", "Kalí evdomáda!"], ["Καλό μήνα!", "¡Buen mes!", "Kaló mína!"]], "rel": ["gr-adjectives", "gr-kalimera", "gr-gender"], "lvl": "A1"}, {"id": "gr-eisitiria-mouseio", "sec": "turismo", "k": "frase", "t": "Δύο εισιτήρια, παρακαλώ", "tr": "Dío isitíria, parakaló", "es": "Dos entradas, por favor", "uso": "Así se piden en la taquilla (ταμείο). Μειωμένο εισιτήριο es la entrada reducida.", "pr": "DHI-o i-si-TI-ria pa-ra-ka-LO", "ej": [["Υπάρχει μειωμένο εισιτήριο για φοιτητές;", "¿Hay entrada reducida para estudiantes?", "Ipárchi mioméno isitírio yia fitités?"], ["Πού είναι το ταμείο;", "¿Dónde está la taquilla?", "Pu íne to tamío?"]], "nota": "Suele haber reducciones o entrada gratuita para jóvenes y estudiantes de la UE, pero las condiciones cambian: compruébalas en la taquilla o en la web oficial antes de ir.", "rel": ["gr-eisitirio", "gr-numbers", "gr-plural"], "lvl": "A1"}, {"id": "gr-ores", "sec": "turismo", "k": "frase", "t": "Τι ώρα ανοίγει / κλείνει;", "tr": "Ti óra aníyi / klíni?", "es": "¿A qué hora abre / cierra?", "uso": "Los horarios cambian entre verano e invierno, y muchos yacimientos cierran antes fuera de temporada.", "pr": "ti O-ra a-NI-yi / KLI-ni", "ej": [["Είναι ανοιχτό τη Δευτέρα;", "¿Está abierto el lunes?", "Íne anichtó ti Deftéra?"]], "nota": "En verano, ve a la Acrópolis u otros yacimientos al abrir: a mediodía el calor es muy fuerte y apenas hay sombra.", "rel": ["gr-ora", "gr-interrogatives", "gr-meres"], "lvl": "A1"}, {"id": "gr-fotografies", "sec": "turismo", "k": "frase", "t": "Επιτρέπονται οι φωτογραφίες;", "tr": "Epitréponde i fotografíes?", "es": "¿Se pueden hacer fotos?", "uso": "Respuesta típica: «Ναι, χωρίς φλας» (sí, sin flash).", "pr": "e-pi-TRE-pon-de i fo-to-gra-FI-es", "ej": [["Μπορείτε να μας βγάλετε μια φωτογραφία;", "¿Nos puede hacer una foto?", "Boríte na mas vgálete mia fotografía?"]], "rel": ["gr-boro-na", "gr-cu-monasterio"], "lvl": "A1"}, {"id": "gr-xaplostres", "sec": "turismo", "k": "frase", "t": "Πόσο κάνουν οι ξαπλώστρες;", "tr": "Póso kánun i xaplóstres?", "es": "¿Cuánto cuestan las tumbonas?", "uso": "Playa: ξαπλώστρα (tumbona), ομπρέλα (sombrilla), αντηλιακό (protector solar), πετσέτα θαλάσσης (toalla de playa). En muchas playas organizadas las tumbonas se pagan, a veces a cambio de una consumición mínima.", "pr": "PO-so KA-nun i ksa-PLOS-tres", "ej": [["Δύο ξαπλώστρες και μια ομπρέλα.", "Dos tumbonas y una sombrilla.", "Dío xaplóstres ke mia ombréla."]], "nota": "En las playas de Grecia, los últimos metros desde el agua son de uso público por ley: puedes poner tu toalla aunque haya tumbonas de un bar.", "rel": ["gr-poso-kanei", "gr-plural", "gr-dromos"], "lvl": "A1"}, {"id": "gr-thalassa", "sec": "turismo", "k": "palabra", "t": "θάλασσα / νησί / βουνό", "tr": "thálassa / nisí / vunó", "es": "mar / isla / montaña", "uso": "Vocabulario de paisaje. Το χωριό es el pueblo; η χώρα, en muchas islas, es la capital de la isla.", "pr": "THA-la-sa / ni-SI / vu-NO", "ej": [["Ποιο νησί μας προτείνετε;", "¿Qué isla nos recomienda?", "Pio nisí mas protínete?"]], "nota": "Si en una isla ves el cartel «Χώρα», indica el pueblo principal, no un país.", "rel": ["gr-pron-th", "gr-gender"], "lvl": "A1"}, {"id": "gr-xenagisi", "sec": "turismo", "k": "frase", "t": "Υπάρχει ξενάγηση στα ισπανικά;", "tr": "Ipárchi xenáyisi sta ispaniká?", "es": "¿Hay visita guiada en español?", "uso": "Ξεναγός es el guía. También: «Πόσο διαρκεί;» (¿cuánto dura?).", "pr": "i-PAR-ji kse-NA-yi-si sta is-pa-ni-KA", "ej": [["Πόσο διαρκεί η ξενάγηση;", "¿Cuánto dura la visita?", "Póso diarkí i xenáyisi?"]], "rel": ["gr-milate", "gr-interrogatives"], "lvl": "A1"}, {"id": "gr-priza", "sec": "servicios", "k": "palabra", "t": "πρίζα / φορτιστής", "tr": "príza / fortistís", "es": "enchufe / cargador", "uso": "Grecia usa los mismos enchufes que España (tipos C y F, 230 V): no necesitas adaptador.", "pr": "PRI-za / for-tis-TIS", "ej": [["Μπορώ να φορτίσω το κινητό μου;", "¿Puedo cargar el móvil?", "Boró na fortíso to kinitó mu?"]], "rel": ["gr-boro-na", "gr-possessives"], "lvl": "A1"}, {"id": "gr-sim", "sec": "servicios", "k": "palabra", "t": "κάρτα SIM / δεδομένα", "tr": "kárta SIM / dedoména", "es": "tarjeta SIM / datos", "uso": "Con una tarifa española, el roaming de la UE funciona en Grecia como en casa, dentro de los límites de uso razonable de tu operador. Κινητό es el móvil.", "pr": "KAR-ta sim / dhe-dho-ME-na", "ej": [["Δεν έχω σήμα.", "No tengo cobertura.", "Den écho síma."]], "rel": ["gr-negation"], "lvl": "A1"}, {"id": "gr-atm", "sec": "servicios", "k": "palabra", "t": "ΑΤΜ (μηχάνημα ανάληψης)", "tr": "ATM (michánima análipsis)", "es": "cajero automático", "uso": "Se dice simplemente «ATM». Si el cajero te ofrece la conversión de moneda, no hace falta: tu cuenta ya está en euros. Revisa la comisión que muestra en pantalla.", "pr": "ei-ti-EM", "ej": [["Πού υπάρχει ATM;", "¿Dónde hay un cajero?", "Pu ipárchi ATM?"]], "nota": "En islas pequeñas puede haber un solo cajero y vaciarse en agosto: lleva algo de efectivo.", "rel": ["gr-pou-einai", "gr-karta"], "lvl": "A1"}, {"id": "gr-plyntirio", "sec": "servicios", "k": "palabra", "t": "πλυντήριο", "tr": "plintírio", "es": "lavandería / lavadora", "uso": "La misma palabra sirve para la lavadora y para la lavandería. Στεγνωτήριο es la secadora.", "pr": "plin-DI-rio", "ej": [["Υπάρχει πλυντήριο κοντά;", "¿Hay una lavandería cerca?", "Ipárchi plintírio kontá?"]], "rel": ["gr-konta"], "lvl": "A1"}, {"id": "gr-sign-anoixto", "sec": "carteles", "k": "palabra", "t": "ΑΝΟΙΧΤΟ / ΚΛΕΙΣΤΟ", "tr": "anichtó / klistó", "es": "Abierto / Cerrado", "uso": "Con tilde: ανοιχτό / κλειστό. También verás la variante ΑΝΟΙΚΤΟ.", "pr": "a-nij-TO / klis-TO", "rel": ["gr-ores", "gr-pron-vowels"], "lvl": "A1"}, {"id": "gr-sign-eisodos", "sec": "carteles", "k": "palabra", "t": "ΕΙΣΟΔΟΣ / ΕΞΟΔΟΣ", "tr": "ísodos / éxodos", "es": "Entrada / Salida", "uso": "Con tilde: είσοδος / έξοδος. ΕΞΟΔΟΣ ΚΙΝΔΥΝΟΥ es la salida de emergencia. En el aeropuerto, «έξοδος» también es la puerta de embarque.", "pr": "I-so-dhos / EK-so-dhos", "rel": ["gr-aerodromio"], "lvl": "A1"}, {"id": "gr-sign-othisate", "sec": "carteles", "k": "palabra", "t": "ΩΘΗΣΑΤΕ / ΕΛΞΑΤΕ", "tr": "othísate / élxate", "es": "Empujar / Tirar", "uso": "Formas cultas que solo verás en las puertas. A veces aparecen las coloquiales: ΣΠΡΩΞΤΕ (empujen) y ΤΡΑΒΗΞΤΕ (tiren).", "pr": "o-THI-sa-te / EL-ksa-te", "rel": ["gr-imperative"], "lvl": "A1"}, {"id": "gr-sign-toualetes", "sec": "carteles", "k": "palabra", "t": "ΤΟΥΑΛΕΤΕΣ — ΑΝΔΡΩΝ / ΓΥΝΑΙΚΩΝ", "tr": "toualétes — andrón / yinekón", "es": "Servicios — Caballeros / Señoras", "uso": "Con tilde: τουαλέτες — ανδρών / γυναικών (genitivo plural: «de hombres», «de mujeres»).", "pr": "tu-a-LE-tes — an-DHRON / yi-ne-KON", "rel": ["gr-cases", "gr-pou-einai"], "lvl": "A1"}, {"id": "gr-sign-apagorevetai", "sec": "carteles", "k": "palabra", "t": "ΑΠΑΓΟΡΕΥΕΤΑΙ…", "tr": "apagorévete", "es": "Prohibido…", "uso": "Con tilde: απαγορεύεται. Ejemplos: ΑΠΑΓΟΡΕΥΕΤΑΙ Η ΕΙΣΟΔΟΣ (prohibido el paso), ΑΠΑΓΟΡΕΥΕΤΑΙ ΤΟ ΚΑΠΝΙΣΜΑ (prohibido fumar), ΑΠΑΓΟΡΕΥΕΤΑΙ ΤΟ ΚΟΛΥΜΠΙ (prohibido bañarse).", "pr": "a-pa-go-RE-ve-te", "rel": ["gr-pron-av-ev", "gr-negation"], "lvl": "A1"}, {"id": "gr-sign-kindynos", "sec": "carteles", "k": "palabra", "t": "ΚΙΝΔΥΝΟΣ / ΠΡΟΣΟΧΗ", "tr": "kíndinos / prosochí", "es": "Peligro / Atención", "uso": "Con tilde: κίνδυνος / προσοχή.", "pr": "KIN-dhi-nos / pro-so-JI", "rel": ["gr-voitheia"], "lvl": "A1"}, {"id": "gr-sign-ekptoseis", "sec": "carteles", "k": "palabra", "t": "ΕΚΠΤΩΣΕΙΣ / ΤΙΜΗ", "tr": "ekptósis / timí", "es": "Rebajas / Precio", "uso": "Con tilde: εκπτώσεις / τιμή. ΔΩΡΕΑΝ es gratis y ΠΩΛΕΙΤΑΙ, «se vende».", "pr": "ek-PTO-sis / ti-MI", "rel": ["gr-poso-kanei"], "lvl": "A1"}, {"id": "gr-sign-afixeis", "sec": "carteles", "k": "palabra", "t": "ΑΦΙΞΕΙΣ / ΑΝΑΧΩΡΗΣΕΙΣ", "tr": "afíxis / anachorísis", "es": "Llegadas / Salidas", "uso": "Con tilde: αφίξεις / αναχωρήσεις. En aeropuertos, puertos y estaciones de autobús.", "pr": "a-FIK-sis / a-na-jo-RI-sis", "rel": ["gr-aerodromio", "gr-pote-fevgei"], "lvl": "A1"}, {"id": "gr-ff-ela", "sec": "costumbres", "k": "palabra", "t": "έλα", "tr": "éla", "es": "¡ven! / ¡venga! / ¿diga?", "uso": "Suena como «ella», pero es el imperativo de «venir». Se usa muchísimo: para animar («¡venga!»), para mostrar sorpresa («¡anda ya!») y para contestar el teléfono entre amigos.", "pr": "E-la", "ej": [["Έλα, πάμε!", "¡Venga, vamos!", "Éla, páme!"]], "rel": ["gr-imperative"], "truco": "Έλα no es «ella»: es «¡ven!».", "lvl": "A1"}, {"id": "gr-ff-mallon", "sec": "costumbres", "k": "palabra", "t": "μάλλον", "tr": "mállon", "es": "probablemente", "uso": "Suena a «mal», pero significa «seguramente, más bien». Μάλιστα (MA-lis-ta), en cambio, es un «sí» formal: «efectivamente».", "pr": "MA-lon", "ej": [["Μάλλον θα βρέξει.", "Seguramente lloverá.", "Mállon tha vréxi."]], "rel": ["gr-future"], "lvl": "A1"}, {"id": "gr-ff-pano", "sec": "costumbres", "k": "palabra", "t": "πάνω tico o el médico.", "rel": ["gr-farmakeio", "gr-giatros", "gr-allergia", "gr-poso-kanei"], "lines": [["Farmacéutico", "Γεια σας, τι θα θέλατε;", "Hola, ¿qué desea?", "Yia sas, ti tha thélate?"], ["Tú", "Έχω πονοκέφαλο και λίγο πυρετό. Έχετε κάτι;", "Tengo dolor de cabeza y algo de fiebre. ¿Tiene algo?", "Écho ponokéfalo ke lígo piretó. Échete káti?"], ["Farmacéutico", "Έχετε αλλεργία σε κάποιο φάρμακο;", "¿Es alérgico a algún medicamento?", "Échete allergía se kápio fármako?"], ["Tú", "Όχι.", "No.", "Óchi."], ["Farmacéutico", "Πάρτε ένα χάπι κάθε οκτώ ώρες.", "Tome una pastilla cada ocho horas.", "Párte éna chápi káthe októ óres."], ["Tú", "Ευχαριστώ. Πόσο κάνει;", "Gracias. ¿Cuánto es?", "Efcharistó. Póso káni?"], ["Farmacéutico", "Τέσσερα ευρώ. Περαστικά!", "Cuatro euros. ¡Que se mejore!", "Téssera evró. Perastiká!"]], "lvl": "A1"}, {"id": "dlg-gr-periptero", "sec": "dialogos", "k": "dialogo", "t": "Στο περίπτερο", "es": "En el quiosco", "nota": "Precio de ejemplo.", "rel": ["gr-magazia", "gr-nero", "gr-eisitirio", "gr-ff-na-ste-kala"], "lines": [["Tú", "Ένα νερό και ένα εισιτήριο για το λεωφορείο, παρακαλώ.", "Un agua y un billete de autobús, por favor.", "Éna neró ke éna isitírio yia to leoforío, parakaló."], ["Quiosquero", "Μικρό ή μεγάλο νερό;", "¿Agua pequeña o grande?", "Mikró i megálo neró?"], ["Tú", "Μικρό.", "Pequeña.", "Mikró."], ["Quiosquero", "Όλα μαζί, τρία ευρώ.", "Todo junto, tres euros.", "Óla mazí, tría evró."], ["Tú", "Ορίστε. Ευχαριστώ!", "Aquí tiene. ¡Gracias!", "Oríste. Efcharistó!"], ["Quiosquero", "Να 'στε καλά!", "¡Que le vaya bien!", "Na 'ste kalá!"]], "lvl": "A1"}];
const TTS = META.tts;
const byId = {}; DATA.forEach(e => byId[e.id] = e);
const secById = {}; META.sections.forEach(s => secById[s.id] = s);
const back = {};
DATA.forEach(e => (e.rel||[]).forEach(r => { (back[r] = back[r] || []).push(e.id); }));
const scanRefs = s => { const out=[]; (s||'').replace(/\[\[([a-z0-9-]+)/g,(m,id)=>out.push(id)); return out; };
DATA.forEach(e => scanRefs([e.uso,e.nota,e.body,e.es].join(' ')).forEach(r=>{ if(r!==e.id && !(e.rel||[]).includes(r)) (back[r]=back[r]||[]).push(e.id); }));

const KIND = {frase:'Frase',palabra:'Vocabulario',regla:'Gramática',sonido:'Sonido',letra:'Letra',tabla:'Referencia',dialogo:'Diálogo'};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => String(s||'').replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g,(m,id,txt)=>{const e=byId[id]; if(!e) return txt||id; return `<a class="xref" href="#f-${id}">${txt||esc(e.t)}</a>`;});
const prHTML = p => esc(p||'').split(/(\s+|-|\/)/).map(tok => /[A-ZÁÉÍÓÚ]/.test(tok) && tok===tok.toUpperCase() ? `<b>${tok}</b>` : tok).join('');
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').toLowerCase();
const normAns = s => norm(s).replace(/[’`´]/g,"'").replace(/[.!¡¿?;:,«»"]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const STUDY_K = new Set(['frase','palabra']);
const studyable = e => STUDY_K.has(e.k);

/* ── progreso guardado en este navegador ── */
const KEY='compendio-'+TTS;
let S={box:{},due:{},fav:[],mode:'consulta',hide:false,tests:[]};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} };
const DAY=864e5, INT=[0,1,3,7,16,35];
const learned = id => (S.box[id]||0)>=2;
const isDue = id => S.box[id]!==undefined && (S.due[id]||0)<=Date.now();
function grade(id,ok){ const b=S.box[id]||0; if(ok){ const nb=Math.min(b+1,5); S.box[id]=nb; S.due[id]=Date.now()+INT[nb]*DAY; } else { S.box[id]=0; S.due[id]=Date.now(); } save(); }
const isStudy = () => S.mode==='estudio';

/* ── voz ── */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices=[]; if(canSpeak){ const lv=()=>{voices=speechSynthesis.getVoices()}; lv(); speechSynthesis.onvoiceschanged=lv; }
function utter(text){ const u=new SpeechSynthesisUtterance(String(text).replace(/\s\/\s/g,'. ').replace(/…/g,' ').replace(/—/g,'. ')); u.lang=TTS; const v=voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===TTS.toLowerCase())||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(TTS.slice(0,2))); if(v)u.voice=v; u.rate=.85; return u; }
function speak(text){ if(!canSpeak) return; try{ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }catch(e){} }
function speakSeq(list){ if(!canSpeak) return; try{ speechSynthesis.cancel(); list.forEach(t=>speechSynthesis.speak(utter(t))); }catch(e){} }

function renderSide(cur){
  if(cur!==undefined) curSec=cur;
  const groups=[...new Set(META.sections.map(s=>s.group))];
  const link=(id,href,name,badge)=>`<a href="${href}" ${curSec===id?'aria-current="page"':''}>${navIcon(id)}<span class="nl">${esc(name)}</span>${badge?`<span class="nb">${badge}</span>`:''}</a>`;
  let h='';
  if(isStudy()){
    const d=dueCount();
    h+=`<p class="ng">Modo estudio</p>`+link('e-ruta','#e-ruta','Plan de estudio')+link('e-tarjetas','#e-tarjetas','Tarjetas',d||'')+link('e-test','#e-test','Test')+link('e-ejercicios','#e-ejercicios','Ejercicios')+link('e-chuletas','#e-chuletas','Chuletas')+link('e-progreso','#e-progreso','Progreso');
  } else {
    h+=link('inicio','#inicio','Inicio')+link('favs','#favs','Mis frases',S.fav.length||'');
  }
  h+=groups.map(g=>`<p class="ng">${esc(g)}</p>`+META.sections.filter(s=>s.group===g).map(s=>link(s.id,'#s-'+s.id,s.name)).join('')).join('');
  document.getElementById('nav').innerHTML=h;
  document.getElementById('curtab').textContent = curSec==='inicio'?'Inicio':curSec==='favs'?'Mis frases':(STUDY_VIEWS[curSec]||(secById[curSec]?secById[curSec].name:'Búsqueda'));
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
  document.getElementById('mtag').hidden=!isStudy();
  document.body.classList.toggle('hide-es', isStudy() && S.hide);
}
const side=document.getElementById('side'), scrim=document.getElementById('scrim'), menuBtn=document.getElementById('menubtn');
function drawer(o){ side.classList.toggle('open',o); scrim.hidden=!o; menuBtn.setAttribute('aria-expanded',String(o)); }
function closeNav(){ drawer(false); }
menuBtn.onclick=()=>drawer(!side.classList.contains('open'));
scrim.onclick=closeNav;
side.addEventListener('click',ev=>{ if(ev.target.closest('a')) closeNav(); });
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
  if(S.mode===b.dataset.mode) return;
  S.mode=b.dataset.mode; save(); closeNav();

  if(isStudy() && (h==='inicio'||h===''||h==='favs')) location.hash='#e-ruta';
  else if(!isStudy() && (h.startsWith('e-'))) location.hash='#inicio';
  else render(true);
});

function renderSearch(q){
  const n=norm(q).trim(); renderSide('');
  const hits = DATA.map(e=>{ const h=norm([e.t,e.tr,e.es].join(' ')); const b=norm([e.uso,e.pr,e.nota,(e.lines||[]).map(l=>l.join(' ')).join(' ')].join(' ')); return {e,score:h.includes(n)?2:(b.includes(n)?1:0)}; }).filter(x=>x.score).sort((a,b)=>b.score-a.score).map(x=>x.e);
  main.innerHTML = `<div class="sec-head"><span class="eyebrow">Búsqueda</span><h1>«${esc(q)}»</h1><p class="lead">${hits.length} ${hits.length===1?'ficha':'fichas'}. Busca en español, en ${esc(META.langName)}${META.translit?' o en transliteración':''}.</p></div>${hits.length?`<div class="cards">${hits.map(card).join('')}</div>`:'<div class="empty">Nada coincide. Prueba con otra palabra o quita alguna letra.</div>'}`;
}

function exList(e){
  return `<ul class="exq">${(e.ejx||[]).map((x,i)=>`<li><span class="q">${esc(x[0])}</span><div class="row"><input type="text" id="ex-${e.id}-${i}" data-ans="${esc(x[1])}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Respuesta"><button type="button" class="btn" data-chk>Comprobar</button><button type="button" class="btn" data-sol>Solución</button></div><span class="res" aria-live="polite"></span></li>`).join('')}</ul>`;
}
let exStats={ok:0,ko:0};
function checkEx(li,reveal){
  const inp=li.querySelector('input'), res=li.querySelector('.res');
  const answers=inp.dataset.ans.split('|'); const pretty=answers.filter(Boolean).join(' / ');
  if(reveal){ res.className='res'; res.textContent='Solución: '+pretty; return; }
  if(!inp.value.trim()){ inp.focus(); return; }
  const ok=answers.some(a=>normAns(a)===normAns(inp.value));
  inp.classList.toggle('ok',ok); inp.classList.toggle('ko',!ok);
  res.className='res '+(ok?'ok':'ko'); res.textContent = ok?'Correcto':'No es eso. Solución: '+pretty;
  if(!li.dataset.done){ li.dataset.done='1'; ok?exStats.ok++:exStats.ko++; const c=document.getElementById('exCount'); if(c) c.innerHTML=`Correctas <b>${exStats.ok}</b> · Fallos <b>${exStats.ko}</b>`; }
}
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-chk]'); if(c){ checkEx(c.closest('li'),false); return; }
  const s=ev.target.closest('[data-sol]'); if(s){ checkEx(s.closest('li'),true); return; }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter' && ev.target.matches('.exq input')){ ev.preventDefault(); checkEx(ev.target.closest('li'),false); } });

let pick={secs:null,label:''};
function startWith(view,secs,label){
  pick={secs,label:label||(secs&&secs.length===1&&secById[secs[0]]?secById[secs[0]].name:'')};
  fc=null; qz=null; cheatSel=secs&&secs.length===1?secs[0]:cheatSel;
  if(location.hash==='#e-'+view) render(true); else location.hash='#e-'+view;
}
function secSelect(idAttr,withAll,cur){
  const opts=META.sections.filter(s=>studyIds([s.id]).length);
  const curKey = cur&&cur.length===1?cur[0]:(cur?'__pick':'');
  return `<label class="field">Qué estudiar<select id="${idAttr}">${withAll?`<option value="">Todo el compendio</option>`:''}${cur&&cur.length>1?`<option value="__pick" selected>${esc(pick.label||'Selección')}</option>`:''}${opts.map(s=>`<option value="${s.id}" ${curKey===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`;
}
const readSel = v => v==='__pick'?pick.secs:(v?[v]:null);
