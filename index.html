<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Compendio de consulta de griego para viajar: alfabeto, frases, gramática, diálogos y modo estudio con tarjetas, test y chuletas.">
<meta name="theme-color" content="#12161d">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Compendio de Griego de Viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: como el Compendio de Valheim — barra lateral oscura con grupos e iconos, interruptor Consulta/Estudio, buscador arriba del contenido; la ficha completa se abre encima */
:root{
  --bg:#eff4f7; --surface:#ffffff; --surface-2:#e5edf2; --ink:#18202c; --muted:#5a6475; --line:#d6dbe3;
  --accent:#0b5fa5; --accent-ink:#ffffff; --accent-soft:#dde9f5; --second:#9a5b0c;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --ko:#b42318; --ko-soft:#fbe2df;
  --f-display:"Commissioner","Segoe UI",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --side:#12161d; --side2:#1b212b; --sidefg:#e6e9ef; --sidemuted:#8b94a4; --glow:#6db3f2; --mbar:54px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171c25; --surface-2:#1d2430; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2b3340;
  --accent:#6db3f2; --accent-ink:#0f131a; --accent-soft:#1b2c3e; --second:#e3ad5b;
  --ok:#5fd08f; --ok-soft:#163626; --ko:#ff8a7e; --ko-soft:#3d1c1a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171c25; --surface-2:#1d2430; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2b3340;
  --accent:#6db3f2; --accent-ink:#0f131a; --accent-soft:#1b2c3e; --second:#e3ad5b;
  --ok:#5fd08f; --ok-soft:#163626; --ko:#ff8a7e; --ko-soft:#3d1c1a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}

/* ── barra lateral ── */
.app{min-height:100%}
.side{background:linear-gradient(180deg,var(--side2),var(--side));color:var(--sidefg);display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-right:1px solid color-mix(in srgb,var(--glow) 22%,transparent)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 16px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.07);text-decoration:none;color:inherit;border-radius:12px 12px 0 0;transition:background .15s}
.brand:hover{background:rgba(255,255,255,.04)}
.sigil{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--glow) 65%,#fff),var(--glow) 55%,color-mix(in srgb,var(--glow) 55%,#000));color:#0d1117;font:800 16px var(--f-display);box-shadow:0 6px 18px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.5)}
.brand:hover .sigil{box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 25%,transparent),0 6px 22px -4px var(--glow)}
.brand b{display:block;font:800 18px/1.1 var(--f-display);color:#fff;letter-spacing:.02em}
.brand small{color:var(--glow);font:700 10.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:6px 4px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.modes button{display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:var(--sidemuted);font:700 13px var(--f-display);padding:8px 0;border-radius:9px;cursor:pointer}
.modes button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modes button[aria-pressed="true"]{background:var(--glow);color:#0d1117}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.ng{margin:14px 10px 6px;font:800 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--sidemuted)}
.nav a{display:flex;align-items:center;gap:11px;width:100%;font:600 14.5px var(--f-display);color:var(--sidefg);text-decoration:none;border-radius:10px;padding:7px 10px;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 22%,transparent),color-mix(in srgb,var(--glow) 5%,transparent));color:var(--glow)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.ni{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.nav a[aria-current="page"] .ni{background:color-mix(in srgb,var(--glow) 16%,transparent);border-color:color-mix(in srgb,var(--glow) 35%,transparent)}
.ni svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nl{flex:1;min-width:0}
.nb{font:700 11px var(--f-display);font-variant-numeric:tabular-nums;color:#0d1117;background:var(--glow);border-radius:999px;padding:1px 7px}
.themes{margin-top:auto;display:flex;gap:4px;padding:4px;margin-inline:10px;border-radius:10px;background:var(--side2);border:1px solid rgba(255,255,255,.06)}
.themes button{flex:1;border:0;background:none;color:var(--sidemuted);font:600 11.5px var(--f-display);padding:6px 0;border-radius:7px;cursor:pointer}
.themes button[aria-pressed="true"]{background:color-mix(in srgb,var(--glow) 18%,transparent);color:var(--glow)}
.sidefoot{margin:0;padding:14px 10px 0;font:11.5px/1.4 var(--f-display);color:var(--sidemuted)}
.side :focus-visible{outline-color:var(--glow)}
.wrap{max-width:1220px;width:100%;margin:0 auto;padding-inline:16px;padding-block:20px 48px;min-width:0}
.gsearch{position:relative;display:block;margin-bottom:22px}
.gsearch input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:15.5px var(--f-display)}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2}
.mbar{display:none}
.scrim{display:none}
@media (min-width:1000px){.app{display:grid;grid-template-columns:256px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;overflow-y:auto}.wrap{padding-inline:32px;padding-block:28px 56px}}
main{min-width:0}

/* ── cabeceras ── */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15}
.eyebrow{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.lead{max-width:65ch;color:var(--muted);font-size:17px}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.sec-head h1{font-size:clamp(28px,4vw,40px);margin:0;font-weight:800}
.sec-head p{margin:0}
h2.sub{font-size:22px;margin:26px 0 12px}

/* ── tarjetas ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-decoration:none;min-width:0;position:relative}
.card:hover{border-color:var(--accent)}
.card .tt{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25;overflow-wrap:anywhere;padding-right:18px}
.card .tr{font-family:var(--f-mono);font-size:12.5px;color:var(--second)}
.card .es{color:var(--muted);font-size:15px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.card .st{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.card .st.ok{background:var(--ok);border-color:var(--ok)}
.card .st.go{border-color:var(--accent)}
.kind{font:600 10.5px var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.kind.regla{color:var(--second);border-color:currentColor}
.kind.sonido,.kind.letra{color:var(--accent);border-color:currentColor}
.kind.dialogo{color:var(--ok);border-color:currentColor}
.pr{font-family:var(--f-mono);font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.pr b{color:var(--accent);font-weight:700}
.lvl{font:700 10.5px var(--f-display);letter-spacing:.06em;color:var(--accent-ink);background:var(--second);border-radius:4px;padding:1px 6px}

/* ── portada ── */
.hero{display:grid;gap:14px;padding-bottom:22px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(32px,5vw,52px);margin:0;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.legend .pr{background:var(--surface-2);padding:2px 8px;border-radius:5px}

/* ── botones y barras de herramientas ── */
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 14px var(--f-display);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.ko{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.field{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-display);color:var(--muted);min-width:0}
.field select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px var(--f-display);max-width:100%}
.check{display:flex;align-items:center;gap:8px;font:500 14px var(--f-display);cursor:pointer}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px}
.muted{color:var(--muted)}
.stat-line{display:flex;flex-wrap:wrap;gap:8px 20px;font:500 14px var(--f-display);color:var(--muted);margin-bottom:14px}
.stat-line b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ── ocultar traducción ── */
body.hide-es .card .es:not(.rev),body.hide-es .ex .t:not(.rev),body.hide-es .dl .t:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}

/* ── ficha ── */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.ficha{width:100%;max-width:720px;background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.f-head{padding:20px 22px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);display:grid;gap:6px;position:relative}
.f-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-right:88px}
.f-head .sname{font:600 12px var(--f-display);color:var(--muted);text-decoration:none}
.f-head .sname:hover{color:var(--accent)}
.f-head h2{margin:0;font-size:clamp(24px,4vw,32px);font-weight:800;overflow-wrap:anywhere}
.f-head .tr{font-family:var(--f-mono);color:var(--second);font-size:14px}
.f-head .es{font-size:18px}
.hbtns{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.x,.star{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.star svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.star[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.f-body{padding:6px 22px 24px;display:grid;gap:4px}
.blk h4{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.blk p{margin:0 0 8px;max-width:65ch}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:4px 12px 4px 9px;font:600 13px var(--f-display);cursor:pointer;flex:none}
.say:hover{background:var(--accent);color:var(--accent-ink)}
.say svg{width:14px;height:14px;fill:currentColor}
.say.sm{padding:3px 8px;font-size:12px}
.pron-box{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px;background:var(--surface-2);border-radius:8px}
.pron-box .pr{font-size:16px}
.pron-box .ipa{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ex,.dl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ex li,.dl li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-left:3px solid var(--accent-soft);background:var(--surface-2);border-radius:0 8px 8px 0}
.dl li.me{border-left-color:var(--accent)}
.ex .o,.dl .o{font-family:var(--f-display);font-weight:600}
.ex .t,.dl .t{display:block;color:var(--muted);font-size:14.5px}
.ex .tx,.dl .tx{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--second)}
.dl .who{display:block;font:700 10.5px var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ex div,.dl div{flex:1;min-width:0}
.note{padding:12px 14px;border:1px dashed var(--second);border-radius:8px;font-size:15px}
.truco{padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:15px}
.err{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.err li{padding:10px 12px;border-radius:8px;background:var(--surface-2);display:grid;gap:2px}
.err s{color:var(--ko);text-decoration-thickness:1.5px;font-family:var(--f-display)}
.err b{color:var(--ok);font-family:var(--f-display)}
.err span{font-size:14px;color:var(--muted)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-family:var(--f-display);font-size:14px}
.rel a:hover{border-color:var(--accent);color:var(--accent)}
.rel a i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grade{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.xref{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px}
a.xref:hover{color:var(--accent)}
.tw{overflow-x:auto;margin:6px 0 12px}
table.tbl{border-collapse:collapse;font-size:14.5px;min-width:100%}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2)}
.tbl td.g{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.tbl td.m{font-family:var(--f-mono);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
footer{padding-block:36px 0;color:var(--muted);font-size:13px;max-width:65ch}

/* ── ejercicios ── */
.exq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.exq li{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--surface-2)}
.exq .q{font-family:var(--f-display);font-weight:600}
.exq .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exq input{flex:1 1 160px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:15px var(--f-display)}
.exq input.ok{border-color:var(--ok);background:var(--ok-soft)}
.exq input.ko{border-color:var(--ko);background:var(--ko-soft)}
.exq .res{font:600 13.5px var(--f-display)}
.exq .res.ok{color:var(--ok)} .exq .res.ko{color:var(--ko)}
.rule-ex{margin-bottom:22px}
.rule-ex h3{font-size:18px;margin:0 0 8px}

/* ── tarjetas de estudio ── */
.fc{display:grid;gap:10px;align-content:center;justify-items:center;text-align:center;min-height:260px;padding:28px 20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;max-width:620px;margin:0 auto}
.fc .q{font:800 clamp(24px,5vw,34px)/1.2 var(--f-display);overflow-wrap:anywhere}
.fc .a{font:700 clamp(22px,4.5vw,30px)/1.25 var(--f-display);color:var(--accent);overflow-wrap:anywhere}
.fc .tr{font-family:var(--f-mono);color:var(--second)}
.fc .hint{font:500 13px var(--f-display);color:var(--muted)}
.fc hr{width:60%;border:0;border-top:1px dashed var(--line);margin:4px 0}
.fc-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.fc-actions .btn{min-width:140px;justify-content:center;padding:11px 16px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.bar.ok i{background:var(--ok)}

/* ── test ── */
.quiz{max-width:640px;margin:0 auto;display:grid;gap:14px}
.quiz .qtext{font:800 clamp(22px,4.5vw,30px)/1.25 var(--f-display);text-align:center;overflow-wrap:anywhere}
.quiz .qkind{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center}
.opts{display:grid;gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:600 16px var(--f-display)}
.opt small{font:400 12.5px var(--f-mono);color:var(--second)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt[disabled]{cursor:default}
.big-say{justify-self:center;font-size:16px;padding:10px 20px}

/* ── ruta y progreso ── */
.days{display:grid;gap:12px}
.day{display:grid;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.day h3{margin:0;font-size:18px}
.day p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font:600 13px var(--f-display);padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.chips a.r{border-style:dashed}
.day .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.day .foot .bar{flex:1 1 120px;max-width:260px}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,200px) 64px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--f-display)}
.prog-row a{text-decoration:none;font-weight:600}
.prog-row span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.big-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.big-stats div{padding:14px;border-radius:12px;background:var(--surface-2);font-family:var(--f-display)}
.big-stats b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.big-stats span{font-size:13px;color:var(--muted)}

/* ── chuletas ── */
.cheat{column-width:330px;column-gap:28px}
.cheat .ci{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line);display:grid;gap:1px}
.cheat .ci b{font-family:var(--f-display)}
.cheat .ci .tr{font-family:var(--f-mono);font-size:12px;color:var(--second)}
.cheat .ci span{font-size:14px;color:var(--muted)}
.cheat h3{column-span:all;font-size:17px;margin:18px 0 6px;color:var(--accent)}
.cheat-g{display:grid;gap:18px}
.cheat-g section{break-inside:avoid}
.cheat-g h3{font-size:18px;margin:0 0 4px}
.cheat-g p{margin:0 0 6px;font-size:14.5px;color:var(--muted);max-width:75ch}

@media (max-width:999px){
  .side{position:fixed;inset:0 auto 0 0;width:min(292px,85vw);z-index:60;transform:translateX(-105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;overflow-y:auto;overscroll-behavior:contain;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:20px 0 50px rgba(0,0,0,.4)}
  .side.open{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(5,5,8,.55);backdrop-filter:blur(2px)}
  .scrim[hidden]{display:none}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--mbar);padding-inline:16px;background:color-mix(in srgb,var(--side) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid color-mix(in srgb,var(--glow) 30%,transparent)}
  .mbar b{flex:1;font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mbar .mtag{flex:none;font:700 10.5px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#0d1117;background:var(--glow);border-radius:999px;padding:3px 9px}
  #menubtn{display:flex;flex-direction:column;justify-content:center;gap:4px;width:40px;height:36px;flex:none;padding:0 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer}
  #menubtn span{display:block;height:2px;background:var(--glow);border-radius:2px}
  .f-head,.f-body{padding-left:16px;padding-right:16px}
  .prog-row{grid-template-columns:minmax(0,1fr) 80px 56px}
}
@media (min-width:1000px){.mtag{display:none}}
@media (prefers-reduced-motion:no-preference){.ficha{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
@media print{
  .side,.mbar,.scrim,.gsearch,.tool,footer,.ov,.no-print{display:none!important}
  .app{display:block}.wrap{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:11pt}
  .cheat{column-width:250px}
}

<script>
const META = {"tts": "el-GR", "langName": "griego", "translit": true, "eyebrow": "Compendio de consulta · Grecia y Chipre", "heroTitle": "Griego para <em>viajar</em>", "intro": "Frases, vocabulario, gramática y el alfabeto para moverte por Grecia. Cada ficha trae la palabra en griego, su lectura en letras latinas, qué significa, para qué sirve y cómo se pronuncia, con enlaces a las reglas y sonidos relacionados.", "legendSample": "ka-li-ME-ra", "legendLink": "gr-alfabeto", "home": ["gr-geia", "gr-kalimera", "gr-efcharisto", "gr-parakalo", "gr-nai-ochi", "gr-signomi", "gr-den-katalaveno", "gr-pou-einai", "gr-poso-kanei", "gr-logariasmo", "gr-voitheia", "gr-alfabeto"], "footer": "Hecho por Tasmanin · Proyecto sin ánimo de lucro, gratuito y sin publicidad. La pronunciación aproximada está pensada para hispanohablantes; el botón Escuchar usa la voz instalada en tu dispositivo.", "sections": [{"id": "saludos", "group": "Situaciones", "name": "Saludos y cortesía", "short": "Hola, gracias, sí y no, no entiendo", "intro": "Con [[gr-geia|γεια σας]], [[gr-efcharisto|ευχαριστώ]] y [[gr-parakalo|παρακαλώ]] ya tienes medio viaje hecho. Cuidado con [[gr-nai-ochi|ναι]]: significa «sí»."}, {"id": "charla", "group": "Situaciones", "name": "Charla y tiempo", "short": "Presentarse, trabajo, gustos, el tiempo", "intro": "Para charlar con el dueño de la taberna o del alojamiento. Los griegos son muy conversadores y agradecen cualquier frase en su idioma."}, {"id": "aeropuerto", "group": "Situaciones", "name": "Aeropuerto y llegada", "short": "Vuelo, pasaporte, maleta, retrasos", "intro": "En aeropuertos y puertos griegos los carteles están también en inglés, pero conviene reconocer las palabras en griego."}, {"id": "alojamiento", "group": "Situaciones", "name": "Alojamiento", "short": "Reserva, habitación, averías", "intro": "Hoteles y los típicos «δωμάτια» de las islas: habitaciones de alquiler familiares."}, {"id": "transporte", "group": "Situaciones", "name": "Transporte", "short": "Billetes, autobús, ferri, taxi, moto", "intro": "Ferris a las islas, autobuses KTEL, metro de Atenas, taxis y alquiler de coche o moto."}, {"id": "orientarse", "group": "Situaciones", "name": "Orientarse", "short": "Dónde está, izquierda, cerca", "intro": "Preguntar el camino y entender la respuesta. La pregunta base es [[gr-pou-einai|Πού είναι;]]"}, {"id": "comer", "group": "Situaciones", "name": "Comer y beber", "short": "Taberna, pedir, cuenta, café", "intro": "De la taberna al café frapé. Para pedir, [[gr-tha-ithela|θα ήθελα]] o simplemente lo que quieres + [[gr-parakalo|παρακαλώ]]."}, {"id": "compras", "group": "Situaciones", "name": "Compras y dinero", "short": "Precio, tarjeta, tique, quiosco", "intro": "Grecia usa el euro. Por ley casi todos los comercios aceptan tarjeta y deben darte tique."}, {"id": "turismo", "group": "Situaciones", "name": "Turismo y playa", "short": "Yacimientos, entradas, playa, islas", "intro": "Museos, yacimientos, monasterios y playas. En verano conviene visitar los yacimientos a primera hora: el calor aprieta y hay poca sombra."}, {"id": "servicios", "group": "Situaciones", "name": "Teléfono y servicios", "short": "Enchufe, móvil, cajero, lavandería", "intro": "Lo práctico. Buena noticia: Grecia usa los mismos enchufes que España y el roaming de la UE funciona como en casa."}, {"id": "emergencias", "group": "Situaciones", "name": "Salud y emergencias", "short": "Socorro, médico, farmacia, policía", "intro": "Número de emergencias: 112 (atienden en inglés). Policía turística: 1571."}, {"id": "dialogos", "group": "Situaciones", "name": "Diálogos completos", "short": "Conversaciones reales de principio a fin", "intro": "Conversaciones completas con su transliteración. Cada línea se puede escuchar por separado o todas seguidas."}, {"id": "numeros", "group": "Referencia", "name": "Números, horas y fechas", "short": "Contar, la hora, días, meses", "intro": "Tablas de consulta. Ojo: el 1, el 3 y el 4 cambian con el [[gr-gender|género]] de lo que cuentas."}, {"id": "carteles", "group": "Referencia", "name": "Carteles y avisos", "short": "Lo que vas a leer por la calle", "intro": "Los carteles van en mayúsculas y <b>sin tildes</b>, así que hay que reconocer las palabras por su forma. Cada ficha te da la versión con tilde para leerla bien."}, {"id": "costumbres", "group": "Cultura", "name": "Costumbres y falsos amigos", "short": "Gestos, horarios y palabras trampa", "intro": "Palabras griegas que suenan a español y significan otra cosa, gestos que conviene conocer y costumbres de la vida diaria."}, {"id": "gramatica", "group": "La lengua", "name": "Gramática", "short": "Artículos, casos, verbos útiles", "intro": "La gramática griega es amplia; aquí está solo lo que aparece en las frases de viaje, explicado desde el español."}, {"id": "alfabeto", "group": "La lengua", "name": "Alfabeto y pronunciación", "short": "Las 24 letras y los grupos que engañan", "intro": "El griego se lee casi siempre como se escribe, una vez conoces las letras y unas pocas combinaciones. En las fichas, <b>th</b> es la z castellana, <b>dh</b> la d suave de «nada», <b>j</b> la jota y <b>z</b> una s sonora."}], "route": [{"t": "Día 1 · El alfabeto", "txt": "Las 24 letras y los grupos que engañan. Con esto ya lees carteles y cartas.", "secs": ["alfabeto"], "read": ["gr-alfabeto", "gr-pron-vowels", "gr-pron-stress"]}, {"t": "Día 2 · Lo imprescindible", "txt": "Saludar, dar las gracias, sí y no, pedir perdón.", "secs": ["saludos"], "read": ["gr-formal", "gr-question-mark"]}, {"t": "Día 3 · Números y dinero", "txt": "Contar, precios, pagar y la hora.", "secs": ["numeros", "compras"], "read": ["gr-gender", "gr-interrogatives"]}, {"t": "Día 4 · Llegar", "txt": "Aeropuerto, hotel y lo que no funciona.", "secs": ["aeropuerto", "alojamiento"], "read": ["gr-articles", "gr-negation"]}, {"t": "Día 5 · Moverse", "txt": "Billetes, ferris, autobuses, taxis y preguntar el camino.", "secs": ["transporte", "orientarse"], "read": ["gr-prepositions", "gr-thelo-na"]}, {"t": "Día 6 · La taberna", "txt": "Mesa, carta, pedir, alergias y la cuenta.", "secs": ["comer"], "read": ["gr-cases", "gr-future"]}, {"t": "Día 7 · Charlar y visitar", "txt": "Conversación, yacimientos, playa e islas.", "secs": ["charla", "turismo"], "read": ["gr-verbs-present", "gr-boro-na"]}, {"t": "Día 8 · Por si acaso", "txt": "Emergencias, servicios, carteles y costumbres.", "secs": ["emergencias", "servicios", "carteles", "costumbres"], "read": ["gr-pronouns", "gr-past"]}, {"t": "Día 9 · Repaso general", "txt": "Diálogos completos y test de todo.", "secs": ["dialogos"], "read": ["gr-possessives", "gr-plural"]}]};
const DATA = [{"id": "gr-geia", "sec": "saludos", "k": "frase", "t": "Γεια σου / Γεια σας", "tr": "Yia su / Yia sas", "es": "Hola / Adiós (informal / formal)", "uso": "El saludo de todo el día, y sirve también para despedirse. Literalmente «salud a ti». «Σου» con una persona de confianza; «σας» con desconocidos o con varias personas. Ver [[gr-formal]].", "pr": "YA su / YA sas", "ej": [["Γεια σας! Ένα τραπέζι για δύο;", "¡Hola! ¿Mesa para dos?", "Yia sas! Éna trapézi yia dío?"], ["Γεια σου, Μαρία!", "¡Hola, María!", "Yia su, María!"]], "nota": "«Γεια» a secas es muy informal, como un «¡ey!».", "rel": ["gr-kalimera", "gr-formal", "gr-antio", "gr-yamas", "gr-pron-gamma"], "say": "Γεια σου. Γεια σας.", "lvl": "A1"}, {"id": "gr-kalimera", "sec": "saludos", "k": "frase", "t": "Καλημέρα / Καλησπέρα / Καληνύχτα", "tr": "Kaliméra / Kalispéra / Kaliníchta", "es": "Buenos días / Buenas tardes / Buenas noches (al despedirse)", "uso": "Καλημέρα hasta el mediodía o primera hora de la tarde. Καλησπέρα desde media tarde, al llegar a un sitio. Καληνύχτα solo al despedirse de noche. Todas empiezan por «καλή» (buena).", "pr": "ka-li-ME-ra / ka-lis-PE-ra / ka-li-NIJ-ta", "ej": [["Καλημέρα! Ένα φραπέ, παρακαλώ.", "¡Buenos días! Un frapé, por favor.", "Kaliméra! Éna frapé, parakaló."]], "rel": ["gr-geia", "gr-adjectives", "gr-pron-chi"], "truco": "Καλή (buena) + μέρα (día) = buen día, todo junto.", "lvl": "A1"}, {"id": "gr-ti-kaneis", "sec": "saludos", "k": "frase", "t": "Τι κάνεις; / Τι κάνετε;", "tr": "Ti kánis? / Ti kánete?", "es": "¿Qué tal? (informal / formal)", "uso": "Literalmente «¿qué haces?». Se responde «Καλά, ευχαριστώ» y se devuelve la pregunta.", "pr": "ti KA-nis / ti KA-ne-te", "ej": [["Καλά, ευχαριστώ. Εσύ;", "Bien, gracias. ¿Y tú?", "Kalá, efcharistó. Esí?"], ["Πολύ καλά!", "¡Muy bien!", "Polí kalá!"]], "nota": "El signo «;» es la interrogación griega. Ver [[gr-question-mark]].", "rel": ["gr-verbs-present", "gr-formal", "gr-efcharisto", "gr-question-mark"], "lvl": "A1"}, {"id": "gr-parakalo", "sec": "saludos", "k": "frase", "t": "Παρακαλώ", "tr": "Parakaló", "es": "Por favor / De nada / ¿Diga?", "uso": "La palabra comodín. Es «por favor» al pedir, «de nada» al contestar a ευχαριστώ, el «¿qué desea?» del camarero, el «¿diga?» del teléfono y el «adelante» al ceder el paso.", "pr": "pa-ra-ka-LO", "ej": [["Ένα νερό, παρακαλώ.", "Un agua, por favor.", "Éna neró, parakaló."], ["— Ευχαριστώ! — Παρακαλώ!", "— ¡Gracias! — ¡De nada!", "Efcharistó! — Parakaló!"]], "rel": ["gr-efcharisto", "gr-tha-ithela"], "truco": "Si dudas qué decir, di παρακαλώ: casi siempre aciertas.", "lvl": "A1"}, {"id": "gr-efcharisto", "sec": "saludos", "k": "frase", "t": "Ευχαριστώ (πολύ)", "tr": "Efcharistó (polí)", "es": "Gracias (muchas)", "uso": "Para dar las gracias. Con varias personas o en nombre de un grupo: ευχαριστούμε (ef-ja-ris-TU-me), «gracias de parte de todos».", "pr": "ef-ja-ris-TO (po-LI)", "ej": [["Ευχαριστώ πολύ για όλα!", "¡Muchas gracias por todo!", "Efcharistó polí yia óla!"]], "nota": "ευ suena «ef» porque le sigue χ, una consonante sorda. Ver [[gr-pron-av-ev]].", "rel": ["gr-parakalo", "gr-pron-av-ev", "gr-pron-chi"], "truco": "Misma raíz que «eucaristía», que en griego significa «acción de gracias».", "lvl": "A1"}, {"id": "gr-nai-ochi", "sec": "saludos", "k": "frase", "t": "Ναι / Όχι", "tr": "Ne / Óchi", "es": "Sí / No", "uso": "La trampa clásica para un hispanohablante: «ναι», que suena «ne», significa SÍ. «Όχι» es no.", "pr": "ne / O-ji", "ej": [["— Είναι μακριά; — Όχι, είναι κοντά.", "— ¿Está lejos? — No, está cerca.", "Íne makriá? — Óchi, íne kontá."]], "nota": "El gesto de levantar la barbilla y las cejas, a veces con un chasquido de lengua, significa «no». Ladear un poco la cabeza al asentir significa «sí».", "rel": ["gr-negation", "gr-entaxei", "gr-pron-vowels"], "truco": "«Όχι» suena a «¡ojo!», que avisa de un no. Por descarte, «ναι» es el sí.", "lvl": "A1"}, {"id": "gr-entaxei", "sec": "saludos", "k": "frase", "t": "Εντάξει", "tr": "Entáxi", "es": "Vale / De acuerdo / Está bien", "uso": "Muy frecuente. Sirve como respuesta, como pregunta («Εντάξει;» = ¿vale?) y para decir que todo va bien.", "pr": "en-DAK-si", "ej": [["Στις οκτώ, εντάξει;", "A las ocho, ¿vale?", "Stis októ, entáxi?"], ["Όλα εντάξει.", "Todo bien.", "Óla entáxi."]], "nota": "ντ en medio de palabra suena «nd». Ver [[gr-pron-mp-nt]].", "rel": ["gr-nai-ochi", "gr-pron-mp-nt"], "lvl": "A1"}, {"id": "gr-oraia", "sec": "saludos", "k": "frase", "t": "Ωραία!", "tr": "Oréa!", "es": "¡Estupendo! / ¡Qué bonito!", "uso": "Para decir que algo te gusta: un sitio, una idea, unas vistas.", "pr": "o-RE-a", "ej": [["Πολύ ωραία!", "¡Muy bonito!", "Polí oréa!"], ["Ωραία θέα!", "¡Qué vistas tan bonitas!", "Oréa théa!"]], "rel": ["gr-adjectives", "gr-nostimo"], "lvl": "A1"}, {"id": "gr-signomi", "sec": "saludos", "k": "frase", "t": "Συγγνώμη", "tr": "Signómi", "es": "Perdón / Disculpe", "uso": "Para pedir perdón, llamar la atención de alguien o pedir paso.", "pr": "sig-NO-mi", "ej": [["Συγγνώμη, πού είναι η στάση;", "Disculpe, ¿dónde está la parada?", "Signómi, pu íne i stási?"]], "nota": "γγ suena «ng» o «g». Ver [[gr-pron-gk]].", "rel": ["gr-pou-einai", "gr-pron-gk"], "lvl": "A1"}, {"id": "gr-den-katalaveno", "sec": "saludos", "k": "frase", "t": "Δεν καταλαβαίνω", "tr": "Den katalavéno", "es": "No entiendo", "uso": "Para frenar una conversación que se te escapa. Añade «Πιο αργά, παρακαλώ» (más despacio, por favor).", "pr": "dhen ka-ta-la-VE-no", "ej": [["Πιο αργά, παρακαλώ.", "Más despacio, por favor.", "Pio argá, parakaló."], ["Μπορείτε να το γράψετε;", "¿Me lo puede escribir?", "Boríte na to grápsete?"]], "nota": "αι suena «e»: katalavéno. Ver [[gr-pron-vowels]].", "rel": ["gr-negation", "gr-milate", "gr-boro-na", "gr-pron-vowels"], "lvl": "A1"}, {"id": "gr-milate", "sec": "saludos", "k": "frase", "t": "Μιλάτε αγγλικά / ισπανικά;", "tr": "Miláte angliká / ispaniká?", "es": "¿Habla inglés / español?", "uso": "En zonas turísticas casi todo el mundo habla inglés. Aun así, cualquier intento en griego se agradece mucho.", "pr": "mi-LA-te an-gli-KA / is-pa-ni-KA", "ej": [["Μιλάω λίγα ελληνικά.", "Hablo un poco de griego.", "Miláo líga elliniká."]], "nota": "Los idiomas van en neutro plural y sin mayúscula: αγγλικά, ισπανικά, ελληνικά.", "rel": ["gr-verbs-present", "gr-formal", "gr-den-katalaveno", "gr-pron-gk"], "lvl": "A1"}, {"id": "gr-me-lene", "sec": "saludos", "k": "frase", "t": "Με λένε… / Είμαι από την Ισπανία", "tr": "Me léne… / Íme apó tin Ispanía", "es": "Me llamo… / Soy de España", "uso": "«Με λένε» significa literalmente «me llaman». Para devolver la pregunta: «Εσένα πώς σε λένε;» (¿y a ti cómo te llaman?).", "pr": "me LE-ne / I-me a-PO tin is-pa-NI-a", "ej": [["Χάρηκα!", "¡Encantado!", "Chárika!"], ["Από πού είσαι;", "¿De dónde eres?", "Apó pu íse?"], ["Είμαι από τη Σεβίλλη.", "Soy de Sevilla.", "Íme apó ti Sevíli."]], "rel": ["gr-einai", "gr-prepositions", "gr-pronouns"], "lvl": "A1"}, {"id": "gr-antio", "sec": "saludos", "k": "frase", "t": "Αντίο / Τα λέμε", "tr": "Antío / Ta léme", "es": "Adiós / Hasta luego", "uso": "«Αντίο» es más definitivo. Lo habitual es «Τα λέμε», «nos lo decimos», es decir, «nos vemos». Al despedirte de un comercio: «Καλή συνέχεια!» (¡que siga bien el día!).", "pr": "an-DI-o / ta LE-me", "ej": [["Τα λέμε αύριο!", "¡Hasta mañana!", "Ta léme ávrio!"], ["Καλή συνέχεια!", "¡Que siga bien!", "Kalí sinéchia!"]], "rel": ["gr-geia", "gr-pron-mp-nt"], "lvl": "A1"}, {"id": "gr-aerodromio", "sec": "aeropuerto", "k": "palabra", "t": "αεροδρόμιο / πτήση", "tr": "aerodrómio / ptísi", "es": "aeropuerto / vuelo", "uso": "Carteles: Αναχωρήσεις (salidas), Αφίξεις (llegadas), Έξοδος (puerta de embarque y también «salida»).", "pr": "a-e-ro-DHRO-mio / PTI-si", "ej": [["Στο αεροδρόμιο, παρακαλώ.", "Al aeropuerto, por favor.", "Sto aerodrómio, parakaló."], ["Η πτήση για Μαδρίτη.", "El vuelo a Madrid.", "I ptísi yia Madríti."]], "nota": "πτ se pronuncian las dos: «PTI-si», como en «apto».", "rel": ["gr-articles", "gr-prepositions", "gr-taxi", "gr-kathysterisi"], "lvl": "A1"}, {"id": "gr-diavatirio", "sec": "aeropuerto", "k": "palabra", "t": "διαβατήριο / ταυτότητα", "tr": "diavatírio / taftótita", "es": "pasaporte / DNI", "uso": "Para viajar de España a Grecia basta con el DNI en vigor: ambos países están en la UE y en Schengen.", "pr": "dhia-va-TI-rio / taf-TO-ti-ta", "ej": [["Το διαβατήριό σας, παρακαλώ.", "Su pasaporte, por favor.", "To diavatírió sas, parakaló."]], "nota": "ταυ suena «taf». Ver [[gr-pron-av-ev]]. El segundo acento de «διαβατήριό σας» se explica en [[gr-possessives]].", "rel": ["gr-pron-av-ev", "gr-possessives", "gr-astynomia"], "lvl": "A1"}, {"id": "gr-valitsa", "sec": "aeropuerto", "k": "palabra", "t": "βαλίτσα / αποσκευές", "tr": "valítsa / aposkevés", "es": "maleta / equipaje", "uso": "Si no aparece tu maleta, ve al mostrador de equipajes perdidos antes de salir de la zona de recogida.", "pr": "va-LI-tsa / a-pos-ke-VES", "ej": [["Η βαλίτσα μου δεν ήρθε.", "Mi maleta no ha llegado.", "I valítsa mu den írthe."], ["Πού είναι οι αποσκευές;", "¿Dónde está el equipaje?", "Pu íne i aposkevés?"]], "rel": ["gr-possessives", "gr-negation", "gr-past", "gr-pron-ts", "gr-plural"], "lvl": "A1"}, {"id": "gr-kathysterisi", "sec": "aeropuerto", "k": "palabra", "t": "καθυστέρηση / ακυρώθηκε", "tr": "kathistérisi / akiróthike", "es": "retraso / cancelado", "uso": "Palabras de las pantallas: καθυστέρηση (retraso), ακυρώθηκε (se ha cancelado), επιβίβαση (embarque), έγκαιρα (en hora).", "pr": "ka-thi-STE-ri-si / a-ki-RO-thi-ke", "ej": [["Η πτήση έχει καθυστέρηση.", "El vuelo tiene retraso.", "I ptísi échi kathistérisi."]], "rel": ["gr-pron-th", "gr-aerodromio", "gr-past"], "lvl": "A1"}, {"id": "gr-kratisi", "sec": "alojamiento", "k": "frase", "t": "Έχω κάνει κράτηση", "tr": "Écho káni krátisi", "es": "Tengo una reserva", "uso": "Lo primero en recepción. Se añade «στο όνομα…» (a nombre de…).", "pr": "E-jo KA-ni KRA-ti-si", "ej": [["Έχω κάνει κράτηση στο όνομα…", "Tengo una reserva a nombre de…", "Écho káni krátisi sto ónoma…"], ["Για τρεις νύχτες.", "Para tres noches.", "Yia tris níchtes."]], "rel": ["gr-verbs-present", "gr-prepositions", "gr-domatio", "gr-numbers"], "lvl": "A1"}, {"id": "gr-domatio", "sec": "alojamiento", "k": "palabra", "t": "δωμάτιο", "tr": "domátio", "es": "habitación", "uso": "Μονόκλινο (individual), δίκλινο (doble), με θέα θάλασσα (con vistas al mar). El cartel «Ενοικιαζόμενα δωμάτια» (Rooms to let) indica alojamiento familiar, típico de las islas.", "pr": "dho-MA-tio", "ej": [["Έχετε ελεύθερο δωμάτιο;", "¿Tiene alguna habitación libre?", "Échete eléfthero domátio?"], ["Δωμάτιο με θέα θάλασσα.", "Habitación con vistas al mar.", "Domátio me théa thálassa."]], "rel": ["gr-articles", "gr-plural", "gr-kratisi", "gr-gender"], "lvl": "A1"}, {"id": "gr-proino", "sec": "alojamiento", "k": "frase", "t": "Περιλαμβάνεται το πρωινό;", "tr": "Perilamvánete to proinó?", "es": "¿Está incluido el desayuno?", "uso": "Pregunta habitual al reservar o al llegar.", "pr": "pe-ri-lam-VA-ne-te to pro-i-NO", "ej": [["Τι ώρα είναι το πρωινό;", "¿A qué hora es el desayuno?", "Ti óra íne to proinó?"]], "nota": "«Πρωινό» también significa «mañana», la parte del día.", "rel": ["gr-question-mark", "gr-ora", "gr-articles"], "lvl": "A1"}, {"id": "gr-wifi", "sec": "alojamiento", "k": "frase", "t": "Ποιος είναι ο κωδικός για το wifi;", "tr": "Pios íne o kodikós yia to wifi?", "es": "¿Cuál es la contraseña del wifi?", "uso": "Κωδικός significa código o contraseña.", "pr": "pios I-ne o ko-dhi-KOS yia to UAI-fai", "ej": [["Το wifi δεν δουλεύει.", "El wifi no funciona.", "To wifi den doulévi."]], "rel": ["gr-interrogatives", "gr-articles", "gr-den-doulevei"], "lvl": "A1"}, {"id": "gr-den-doulevei", "sec": "alojamiento", "k": "frase", "t": "Δεν δουλεύει…", "tr": "Den doulévi…", "es": "No funciona…", "uso": "Para cualquier avería: ο κλιματισμός (el aire acondicionado), το ντους (la ducha), το φως (la luz), η τηλεόραση (la tele).", "pr": "dhen dhu-LE-vi", "ej": [["Δεν δουλεύει ο κλιματισμός.", "No funciona el aire acondicionado.", "Den doulévi o klimatismós."], ["Δεν έχει ζεστό νερό.", "No hay agua caliente.", "Den échi zestó neró."]], "nota": "En muchas islas el papel higiénico no se tira al váter sino a la papelera, porque las tuberías son estrechas. Lo verás en carteles.", "rel": ["gr-negation", "gr-verbs-present", "gr-pron-mp-nt"], "lvl": "A1"}, {"id": "gr-kleidi", "sec": "alojamiento", "k": "palabra", "t": "κλειδί / πετσέτες", "tr": "kleidí / petsétes", "es": "llave / toallas", "uso": "Peticiones a recepción: πετσέτες (toallas), μαξιλάρι (almohada), κουβέρτα (manta), χαρτί υγείας (papel higiénico).", "pr": "kli-DHI / pe-TSE-tes", "ej": [["Μπορώ να έχω κι άλλες πετσέτες;", "¿Me puede dar más toallas?", "Boró na écho ki álles petsétes?"], ["Το κλειδί, παρακαλώ.", "La llave, por favor.", "To kleidí, parakaló."]], "nota": "ει suena «i»: κλειδί es «kli-DHI».", "rel": ["gr-boro-na", "gr-plural", "gr-pron-vowels", "gr-pron-ts"], "lvl": "A1"}, {"id": "gr-eisitirio", "sec": "transporte", "k": "palabra", "t": "εισιτήριο", "tr": "isitírio", "es": "billete", "uso": "Απλό (solo ida), με επιστροφή (ida y vuelta). En el metro y el autobús de Atenas se valida al entrar.", "pr": "i-si-TI-rio", "ej": [["Δύο εισιτήρια για τη Νάξο, παρακαλώ.", "Dos billetes para Naxos, por favor.", "Dío isitíria yia ti Náxo, parakaló."], ["Πόσο κάνει το εισιτήριο;", "¿Cuánto cuesta el billete?", "Póso káni to isitírio?"]], "rel": ["gr-numbers", "gr-plural", "gr-prepositions", "gr-poso-kanei", "gr-pron-vowels"], "lvl": "A1"}, {"id": "gr-leoforeio", "sec": "transporte", "k": "palabra", "t": "λεωφορείο / στάση / μετρό", "tr": "leoforío / stási / metró", "es": "autobús / parada / metro", "uso": "Los autobuses interurbanos y de las islas se llaman ΚΤΕΛ (KTEL). En Atenas hay metro, tranvía y autobuses urbanos.", "pr": "le-o-fo-RI-o / STA-si / me-TRO", "ej": [["Πού είναι η στάση του λεωφορείου;", "¿Dónde está la parada del autobús?", "Pu íne i stási tu leoforíu?"], ["Αυτό το λεωφορείο πάει στο κέντρο;", "¿Este autobús va al centro?", "Aftó to leoforío pái sto kéntro?"]], "nota": "«Του λεωφορείου» es el genitivo: «del autobús». Ver [[gr-cases]].", "rel": ["gr-cases", "gr-pou-einai", "gr-prepositions"], "lvl": "A1"}, {"id": "gr-ploio", "sec": "transporte", "k": "palabra", "t": "πλοίο / λιμάνι", "tr": "plío / limáni", "es": "barco, ferri / puerto", "uso": "Para ir a las islas. El Pireo (Πειραιάς) es el gran puerto de Atenas; Rafina y Lavrio son los otros. Καράβι es otra palabra común para barco.", "pr": "PLI-o / li-MA-ni", "ej": [["Τι ώρα φεύγει το πλοίο για τη Σαντορίνη;", "¿A qué hora sale el ferri a Santorini?", "Ti óra févyi to plío yia ti Santoríni?"], ["Από ποια πύλη;", "¿Desde qué puerta?", "Apó pia píli?"]], "nota": "En el Pireo cada destino sale de una puerta (πύλη, E1, E7…) y puede estar lejos de la otra. Llega con tiempo.", "rel": ["gr-pote-fevgei", "gr-pron-vowels", "gr-interrogatives"], "lvl": "A1"}, {"id": "gr-taxi", "sec": "transporte", "k": "frase", "t": "Σε αυτή τη διεύθυνση, παρακαλώ", "tr": "Se aftí ti diéfthinsi, parakaló", "es": "A esta dirección, por favor", "uso": "Enseña la dirección escrita. Pregunta antes el precio aproximado.", "pr": "se af-TI ti dhi-EF-thin-si pa-ra-ka-LO", "ej": [["Στο ξενοδοχείο, παρακαλώ.", "Al hotel, por favor.", "Sto xenodochío, parakaló."], ["Πόσο θα κοστίσει;", "¿Cuánto costará?", "Póso tha kostísi?"], ["Σταματήστε εδώ, παρακαλώ.", "Pare aquí, por favor.", "Stamatíste edó, parakaló."]], "nota": "En Atenas los taxis son amarillos. Pide que pongan el taxímetro (ταξίμετρο).", "rel": ["gr-prepositions", "gr-future", "gr-parakalo", "gr-imperative"], "lvl": "A1"}, {"id": "gr-pote-fevgei", "sec": "transporte", "k": "frase", "t": "Τι ώρα φεύγει / φτάνει;", "tr": "Ti óra févyi / ftáni?", "es": "¿A qué hora sale / llega?", "uso": "Para trenes, barcos y autobuses.", "pr": "ti O-ra FEV-yi / FTA-ni", "ej": [["Τι ώρα φτάνει το τρένο;", "¿A qué hora llega el tren?", "Ti óra ftáni to tréno?"], ["Φεύγει στις δέκα.", "Sale a las diez.", "Févyi stis déka."]], "nota": "ευ ante γ suena «ev»: FEV-yi. Ver [[gr-pron-av-ev]].", "rel": ["gr-interrogatives", "gr-ora", "gr-pron-av-ev", "gr-pron-gamma", "gr-ploio"], "lvl": "A1"}, {"id": "gr-enoikiasi", "sec": "transporte", "k": "frase", "t": "Θέλω να νοικιάσω ένα αυτοκίνητο", "tr": "Thélo na nikiáso éna aftokínito", "es": "Quiero alquilar un coche", "uso": "En islas pequeñas es habitual alquilar μηχανάκι (motillo) o γουρούνα (quad). Gasolina: βενζίνη.", "pr": "THE-lo na ni-KIA-so E-na af-to-KI-ni-to", "ej": [["Για τρεις μέρες.", "Para tres días.", "Yia tris méres."], ["Περιλαμβάνεται η ασφάλεια;", "¿Incluye el seguro?", "Perilamvánete i asfália?"]], "nota": "Para alquilar moto o quad necesitas el carné correspondiente; lo revisan cada vez más.", "rel": ["gr-thelo-na", "gr-numbers", "gr-pron-av-ev"], "lvl": "A1"}, {"id": "gr-pou-einai", "sec": "orientarse", "k": "frase", "t": "Πού είναι…;", "tr": "Pu íne…?", "es": "¿Dónde está…?", "uso": "La pregunta clave. «Είναι» vale para singular y plural (está / están).", "pr": "pu I-ne", "ej": [["Πού είναι η τουαλέτα;", "¿Dónde está el servicio?", "Pu íne i toualéta?"], ["Πού είναι το πιο κοντινό φαρμακείο;", "¿Dónde está la farmacia más cercana?", "Pu íne to pio kontinó farmakío?"]], "nota": "Con tilde, πού es «dónde»; sin tilde, που es «que» (relativo).", "rel": ["gr-interrogatives", "gr-einai", "gr-articles", "gr-signomi", "gr-farmakeio", "gr-pron-stress"], "truco": "Πού (dónde) suena a «pu» de «puerto»: ¿dónde está el puerto?", "lvl": "A1"}, {"id": "gr-aristera", "sec": "orientarse", "k": "frase", "t": "αριστερά / δεξιά / ευθεία", "tr": "aristerá / dexiá / efthía", "es": "izquierda / derecha / recto", "uso": "Las indicaciones que te van a dar.", "pr": "a-ris-te-RA / dhek-SIA / ef-THI-a", "ej": [["Στρίψτε δεξιά.", "Gire a la derecha.", "Strípste dexiá."], ["Πάτε ευθεία.", "Siga recto.", "Páte efthía."], ["Στη γωνία.", "En la esquina.", "Sti gonía."]], "rel": ["gr-konta", "gr-pron-th", "gr-pron-av-ev", "gr-imperative"], "lvl": "A1"}, {"id": "gr-konta", "sec": "orientarse", "k": "frase", "t": "κοντά / μακριά", "tr": "kontá / makriá", "es": "cerca / lejos", "uso": "Las distancias se suelen dar en minutos. «Με τα πόδια» es «a pie».", "pr": "kon-DA / ma-KRIA", "ej": [["Είναι μακριά;", "¿Está lejos?", "Íne makriá?"], ["Πέντε λεπτά με τα πόδια.", "Cinco minutos a pie.", "Pénde leptá me ta pódia."]], "rel": ["gr-aristera", "gr-pron-mp-nt", "gr-numbers", "gr-nai-ochi"], "lvl": "A1"}, {"id": "gr-chathika", "sec": "orientarse", "k": "frase", "t": "Χάθηκα", "tr": "Cháthika", "es": "Me he perdido", "uso": "Una sola palabra. Sigue con «¿Me lo puede indicar en el mapa?».", "pr": "JA-thi-ka", "ej": [["Μπορείτε να μου δείξετε στον χάρτη;", "¿Me lo puede indicar en el mapa?", "Boríte na mu díxete ston chárti?"]], "rel": ["gr-boro-na", "gr-past", "gr-pron-chi"], "lvl": "A1"}, {"id": "gr-dromos", "sec": "orientarse", "k": "palabra", "t": "οδός / πλατεία / παραλία", "tr": "odós / platía / paralía", "es": "calle / plaza / playa", "uso": "En direcciones escritas verás Οδός (Οδ.) para calle y Λεωφόρος (Λεωφ.) para avenida. Δρόμος es calle o camino en general.", "pr": "o-DHOS / pla-TI-a / pa-ra-LI-a", "ej": [["Πού είναι η παραλία;", "¿Dónde está la playa?", "Pu íne i paralía?"]], "nota": "Οδός es femenino aunque acabe en -ος: η οδός. Ver [[gr-gender]].", "rel": ["gr-articles", "gr-gender"], "lvl": "A1"}, {"id": "gr-trapezi", "sec": "comer", "k": "frase", "t": "Ένα τραπέζι για δύο", "tr": "Éna trapézi yia dío", "es": "Una mesa para dos", "uso": "Al entrar en la taberna. En verano casi todo el mundo cena fuera y tarde, como en España.", "pr": "E-na tra-PE-zi yia DHI-o", "ej": [["Έχετε τραπέζι για τέσσερις;", "¿Tiene mesa para cuatro?", "Échete trapézi yia tésseris?"], ["Μπορούμε να καθίσουμε έξω;", "¿Podemos sentarnos fuera?", "Borúme na kathísume éxo?"]], "nota": "«Τέσσερις» y no «τέσσερα» porque cuenta personas. Ver [[gr-numbers]].", "rel": ["gr-numbers", "gr-boro-na", "gr-prepositions"], "lvl": "A1"}, {"id": "gr-tha-ithela", "sec": "comer", "k": "frase", "t": "Θα ήθελα… / Θέλω…", "tr": "Tha íthela… / Thélo…", "es": "Quisiera… / Quiero…", "uso": "«Θα ήθελα» es lo más cortés. En Grecia «θέλω… παρακαλώ» también suena normal y nada brusco.", "pr": "tha I-the-la / THE-lo", "ej": [["Θα ήθελα μια χωριάτικη σαλάτα.", "Quisiera una ensalada griega.", "Tha íthela mia choriátiki saláta."], ["Θέλω ένα φραπέ, παρακαλώ.", "Quiero un frapé, por favor.", "Thélo éna frapé, parakaló."]], "rel": ["gr-thelo-na", "gr-future", "gr-parakalo", "gr-katalogo", "gr-pron-th"], "lvl": "A1"}, {"id": "gr-katalogo", "sec": "comer", "k": "frase", "t": "Τον κατάλογο, παρακαλώ", "tr": "Ton katálogo, parakaló", "es": "La carta, por favor", "uso": "Κατάλογος es la carta. Muchas tabernas tienen además platos del día: pregunta qué hay.", "pr": "ton ka-TA-lo-go pa-ra-ka-LO", "ej": [["Τι μας προτείνετε;", "¿Qué nos recomienda?", "Ti mas protínete?"], ["Τι έχει αυτό;", "¿Qué lleva esto?", "Ti échi aftó?"]], "nota": "Va en acusativo (τον κατάλογο) porque es lo que pides. Ver [[gr-cases]].", "rel": ["gr-cases", "gr-logariasmo", "gr-tha-ithela"], "lvl": "A1"}, {"id": "gr-logariasmo", "sec": "comer", "k": "frase", "t": "Τον λογαριασμό, παρακαλώ", "tr": "Ton logariasmó, parakaló", "es": "La cuenta, por favor", "uso": "La propina no es obligatoria: se suele redondear o dejar un 5–10 % en efectivo. Muchas tabernas invitan al final a postre o a un licor.", "pr": "ton lo-ga-riaz-MO pa-ra-ka-LO", "ej": [["Μπορώ να πληρώσω με κάρτα;", "¿Puedo pagar con tarjeta?", "Boró na pliróso me kárta?"], ["Χωριστά, παρακαλώ.", "Por separado, por favor.", "Choristá, parakaló."]], "nota": "La σ ante μ suena como z: «lo-ga-riaz-MO». Ver [[gr-pron-s]].", "rel": ["gr-cases", "gr-karta", "gr-pron-s"], "lvl": "A1"}, {"id": "gr-nero", "sec": "comer", "k": "palabra", "t": "νερό / κρασί / μπίρα / καφές", "tr": "neró / krasí / bíra / kafés", "es": "agua / vino / cerveza / café", "uso": "Cafés: ελληνικός (griego, con poso), φραπέ (batido y frío), φρέντο εσπρέσο (espresso frío). Se piden σκέτο (sin azúcar), μέτριο (medio) o γλυκό (dulce).", "pr": "ne-RO / kra-SI / BI-ra / ka-FES", "ej": [["Ένα μπουκάλι νερό.", "Una botella de agua.", "Éna bukáli neró."], ["Ένα ποτήρι κόκκινο κρασί.", "Una copa de vino tinto.", "Éna potíri kókkino krasí."], ["Ένα φρέντο εσπρέσο σκέτο.", "Un espresso frío sin azúcar.", "Éna frédo espréso skéto."]], "nota": "μπ al principio suena b: μπίρα es «BI-ra». Ver [[gr-pron-mp-nt]].", "rel": ["gr-pron-mp-nt", "gr-gender", "gr-tha-ithela"], "lvl": "A1"}, {"id": "gr-yamas", "sec": "comer", "k": "frase", "t": "Γεια μας! / Στην υγειά μας!", "tr": "Yia mas! / Stin iyiá mas!", "es": "¡Salud! (brindis)", "uso": "Literalmente «salud a nosotros». Se mira a los ojos al chocar los vasos.", "pr": "YA mas / stin i-YA mas", "ej": [["Γεια μας!", "¡Salud!", "Yia mas!"]], "rel": ["gr-geia", "gr-possessives"], "lvl": "A1"}, {"id": "gr-allergia", "sec": "comer", "k": "frase", "t": "Έχω αλλεργία σε…", "tr": "Écho allergía se…", "es": "Tengo alergia a…", "uso": "Alergias comunes: ξηρούς καρπούς (frutos secos), γλουτένη (gluten), θαλασσινά (marisco), γάλα (leche).", "pr": "E-jo a-ler-YI-a se", "ej": [["Έχω αλλεργία στους ξηρούς καρπούς.", "Tengo alergia a los frutos secos.", "Écho allergía stus xirús karpús."], ["Έχει γλουτένη;", "¿Lleva gluten?", "Échi gluténi?"]], "nota": "Lleva una tarjeta con tus alergias escritas en griego para enseñarla en la taberna.", "rel": ["gr-prepositions", "gr-cases", "gr-giatros"], "lvl": "A1"}, {"id": "gr-chortofagos", "sec": "comer", "k": "frase", "t": "Είμαι χορτοφάγος", "tr": "Íme chortofágos", "es": "Soy vegetariano/a", "uso": "Platos sin carne muy comunes: γεμιστά (verduras rellenas de arroz), φασολάδα (sopa de alubias), χόρτα (verduras silvestres), σπανακόπιτα (empanada de espinacas).", "pr": "I-me jor-to-FA-gos", "ej": [["Έχει κρέας;", "¿Lleva carne?", "Échi kréas?"]], "rel": ["gr-einai", "gr-pron-chi"], "lvl": "A1"}, {"id": "gr-nostimo", "sec": "comer", "k": "frase", "t": "Πολύ νόστιμο!", "tr": "Polí nóstimo!", "es": "¡Muy rico!", "uso": "El mejor cumplido para la cocina.", "pr": "po-LI NOS-ti-mo", "ej": [["Ήταν πολύ νόστιμο, ευχαριστούμε!", "¡Estaba muy rico, gracias!", "Ítan polí nóstimo, efcharistúme!"]], "rel": ["gr-adjectives", "gr-oraia", "gr-past"], "lvl": "A1"}, {"id": "gr-poso-kanei", "sec": "compras", "k": "frase", "t": "Πόσο κάνει;", "tr": "Póso káni?", "es": "¿Cuánto cuesta?", "uso": "En plural: «Πόσο κάνουν;». Moneda: ευρώ (ev-RO); los céntimos son λεπτά (lep-TA).", "pr": "PO-so KA-ni", "ej": [["Πόσο κάνει αυτό;", "¿Cuánto cuesta esto?", "Póso káni aftó?"], ["Κάνει δέκα ευρώ.", "Cuesta diez euros.", "Káni déka evró."]], "rel": ["gr-interrogatives", "gr-numbers", "gr-verbs-present"], "lvl": "A1"}, {"id": "gr-karta", "sec": "compras", "k": "frase", "t": "Μπορώ να πληρώσω με κάρτα;", "tr": "Boró na pliróso me kárta?", "es": "¿Puedo pagar con tarjeta?", "uso": "Μετρητά es efectivo. Por ley casi todos los comercios y taxis deben aceptar tarjeta.", "pr": "bo-RO na pli-RO-so me KAR-ta", "ej": [["Μόνο μετρητά.", "Solo efectivo.", "Móno metritá."]], "rel": ["gr-boro-na", "gr-apodeixi", "gr-logariasmo", "gr-prepositions"], "lvl": "A1"}, {"id": "gr-akrivo", "sec": "compras", "k": "palabra", "t": "ακριβό / φτηνό", "tr": "akrivó / ftinó", "es": "caro / barato", "uso": "Para comparar se pone «πιο» delante: πιο φτηνό (más barato).", "pr": "a-kri-VO / fti-NO", "ej": [["Είναι πολύ ακριβό.", "Es muy caro.", "Íne polí akrivó."], ["Έχετε κάτι πιο φτηνό;", "¿Tiene algo más barato?", "Échete káti pio ftinó?"]], "rel": ["gr-adjectives"], "lvl": "A1"}, {"id": "gr-apodeixi", "sec": "compras", "k": "palabra", "t": "απόδειξη", "tr": "apódixi", "es": "tique / recibo", "uso": "En Grecia es obligatorio dar tique. Si no te lo dan, pídelo.", "pr": "a-PO-dhik-si", "ej": [["Την απόδειξη, παρακαλώ.", "El tique, por favor.", "Tin apódixi, parakaló."]], "rel": ["gr-karta", "gr-cases"], "lvl": "A1"}, {"id": "gr-mono-koitazo", "sec": "compras", "k": "frase", "t": "Απλώς κοιτάζω", "tr": "Aplós kitázo", "es": "Solo estoy mirando", "uso": "Respuesta a «Μπορώ να σας βοηθήσω;» (¿le puedo ayudar?).", "pr": "a-PLOS ki-TA-zo", "ej": [["— Μπορώ να σας βοηθήσω; — Απλώς κοιτάζω, ευχαριστώ.", "— ¿Le puedo ayudar? — Solo miro, gracias.", "Boró na sas voithíso? — Aplós kitázo, efcharistó."]], "nota": "οι suena «i»: κοιτάζω es «ki-TA-zo».", "rel": ["gr-verbs-present", "gr-pron-vowels"], "lvl": "A1"}, {"id": "gr-magazia", "sec": "compras", "k": "palabra", "t": "φούρνος / περίπτερο / σούπερ μάρκετ", "tr": "fúrnos / períptero / súper márket", "es": "panadería / quiosco / supermercado", "uso": "El περίπτερο es un quiosco de calle que vende de todo: agua, tabaco, billetes de autobús, cargadores. El φούρνος vende también empanadas (πίτες) como la τυρόπιτα de queso.", "pr": "FUR-nos / pe-RIP-te-ro / SU-per MAR-ket", "ej": [["Ένα μπουκάλι νερό και μια τυρόπιτα.", "Una botella de agua y una empanada de queso.", "Éna bukáli neró ke mia tirópita."]], "rel": ["gr-articles", "gr-pron-vowels"], "lvl": "A1"}, {"id": "gr-voitheia", "sec": "emergencias", "k": "frase", "t": "Βοήθεια!", "tr": "Voíthia!", "es": "¡Socorro!", "uso": "El 112 funciona en toda Grecia y atienden en inglés. Policía turística: 1571.", "pr": "vo-I-thi-a", "ej": [["Καλέστε την αστυνομία!", "¡Llamen a la policía!", "Kaléste tin astinomía!"], ["Καλέστε ασθενοφόρο!", "¡Llamen a una ambulancia!", "Kaléste asthenofóro!"]], "rel": ["gr-astynomia", "gr-imperative", "gr-pron-th"], "lvl": "A1"}, {"id": "gr-giatros", "sec": "emergencias", "k": "frase", "t": "Χρειάζομαι γιατρό", "tr": "Chriázome yiatró", "es": "Necesito un médico", "uso": "Νοσοκομείο es el hospital. Síntomas: έχω πυρετό (tengo fiebre), με πονάει… (me duele…).", "pr": "jri-A-zo-me ya-TRO", "ej": [["Πού είναι το νοσοκομείο;", "¿Dónde está el hospital?", "Pu íne to nosokomío?"], ["Έχω πυρετό.", "Tengo fiebre.", "Écho piretó."]], "nota": "Con la Tarjeta Sanitaria Europea te atienden en la sanidad pública griega.", "rel": ["gr-ponaei", "gr-farmakeio", "gr-cases", "gr-pron-gamma"], "lvl": "A1"}, {"id": "gr-ponaei", "sec": "emergencias", "k": "frase", "t": "Με πονάει εδώ", "tr": "Me ponái edó", "es": "Me duele aquí", "uso": "Partes del cuerpo: το κεφάλι (la cabeza), το στομάχι (el estómago), ο λαιμός (la garganta), το δόντι (la muela).", "pr": "me po-NA-i e-DHO", "ej": [["Με πονάει το κεφάλι.", "Me duele la cabeza.", "Me ponái to kefáli."]], "nota": "Como en español, quien sufre el dolor va como objeto: «με» = me. Ver [[gr-pronouns]].", "rel": ["gr-pronouns", "gr-giatros"], "lvl": "A1"}, {"id": "gr-farmakeio", "sec": "emergencias", "k": "palabra", "t": "φαρμακείο", "tr": "farmakío", "es": "farmacia", "uso": "Llevan una cruz verde, como en España. Hay farmacias de guardia (εφημερεύοντα φαρμακεία); la lista suele estar en la puerta.", "pr": "far-ma-KI-o", "ej": [["Έχετε κάτι για τον πονοκέφαλο;", "¿Tiene algo para el dolor de cabeza?", "Échete káti yia ton ponokéfalo?"], ["Χρειάζεται συνταγή;", "¿Hace falta receta?", "Chriázete sindayí?"]], "rel": ["gr-pou-einai", "gr-giatros"], "lvl": "A1"}, {"id": "gr-astynomia", "sec": "emergencias", "k": "palabra", "t": "αστυνομία", "tr": "astinomía", "es": "policía", "uso": "Para robos y pérdidas. La τουριστική αστυνομία (policía turística, 1571) atiende en inglés.", "pr": "as-ti-no-MI-a", "ej": [["Μου έκλεψαν το πορτοφόλι.", "Me han robado la cartera.", "Mu éklepsan to portofóli."], ["Έχασα το διαβατήριό μου.", "He perdido el pasaporte.", "Échasa to diavatírió mu."]], "rel": ["gr-past", "gr-voitheia", "gr-presveia", "gr-possessives", "gr-pronouns"], "lvl": "A1"}, {"id": "gr-presveia", "sec": "emergencias", "k": "palabra", "t": "πρεσβεία", "tr": "presvía", "es": "embajada", "uso": "La embajada de España está en Atenas. Si pierdes la documentación, te expide un salvoconducto para volver.", "pr": "prez-VI-a", "ej": [["Πού είναι η Ισπανική πρεσβεία;", "¿Dónde está la embajada d \/tr><tr><td class=\"m\">11<\/td><td class=\"g\">έντεκα<\/td><td class=\"m\">EN-de-ka<\/td><\/tr><tr><td class=\"m\">12<\/td><td class=\"g\">δώδεκα<\/td><td class=\"m\">DHO-dhe-ka<\/td><\/tr><tr><td class=\"m\">13<\/td><td class=\"g\">δεκατρία<\/td><td class=\"m\">dhe-ka-TRI-a<\/td><\/tr><tr><td class=\"m\">14<\/td><td class=\"g\">δεκατέσσερα<\/td><td class=\"m\">dhe-ka-TE-se-ra<\/td><\/tr><tr><td class=\"m\">15<\/td><td class=\"g\">δεκαπέντε<\/td><td class=\"m\">dhe-ka-PEN-de<\/td><\/tr><tr><td class=\"m\">16<\/td><td class=\"g\">δεκαέξι<\/td><td class=\"m\">dhe-ka-E-ksi<\/td><\/tr><tr><td class=\"m\">17<\/td><td class=\"g\">δεκαεπτά<\/td><td class=\"m\">dhe-ka-ep-TA<\/td><\/tr><tr><td class=\"m\">18<\/td><td class=\"g\">δεκαοκτώ<\/td><td class=\"m\">dhe-ka-ok-TO<\/td><\/tr><tr><td class=\"m\">19<\/td><td class=\"g\">δεκαεννέα<\/td><td class=\"m\">dhe-ka-e-NE-a<\/td><\/tr><tr><td class=\"m\">20<\/td><td class=\"g\">είκοσι<\/td><td class=\"m\">I-ko-si<\/td><\/tr><\/tbody><\/table><\/div><h4>Decenas y grandes<\/h4><div class=\"tw\"><table class=\"tbl\"><thead><tr><th>N.º<\/th><th>Griego<\/th><th>Se pronuncia<\/th><\/tr><\/thead><tbody><tr><td class=\"m\">21<\/td><td class=\"g\">είκοσι ένα<\/td><td class=\"m\">I-ko-si E-na<\/td><\/tr><tr><td class=\"m\">30<\/td><td class=\"g\">τριάντα<\/td><td class=\"m\">TRIAN-da<\/td><\/tr><tr><td class=\"m\">40<\/td><td class=\"g\">σαράντα<\/td><td class=\"m\">sa-RAN-da<\/td><\/tr><tr><td class=\"m\">50<\/td><td class=\"g\">πενήντα<\/td><td class=\"m\">pe-NIN-da<\/td><\/tr><tr><td class=\"m\">60<\/td><td class=\"g\">εξήντα<\/td><td class=\"m\">ek-SIN-da<\/td><\/tr><tr><td class=\"m\">70<\/td><td class=\"g\">εβδομήντα<\/td><td class=\"m\">ev-dho-MIN-da<\/td><\/tr><tr><td class=\"m\">80<\/td><td class=\"g\">ογδόντα<\/td><td class=\"m\">og-DHON-da<\/td><\/tr><tr><td class=\"m\">90<\/td><td class=\"g\">ενενήντα<\/td><td class=\"m\">e-ne-NIN-da<\/td><\/tr><tr><td class=\"m\">100<\/td><td class=\"g\">εκατό<\/td><td class=\"m\">e-ka-TO<\/
