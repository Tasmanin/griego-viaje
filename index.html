   <div class="tool">${d?`<button type="button" class="btn pri" data-go="tarjetas" data-label="Pendientes de hoy">Repasar las ${d} pendientes</button>`:''}<a class="btn" href="#e-test">Test rápido de todo</a></div>
   <div class="days">${(META.route||[]).map((r,i)=>{ const ids=studyIds(r.secs); const dl=ids.filter(learned).length; const pct=ids.length?Math.round(dl*100/ids.length):0;
     return `<article class="day"><h3>${esc(r.t)}</h3><p>${esc(r.txt)}</p>
       <div class="chips">${r.secs.map(s=>secById[s]?`<a href="#s-${s}">${esc(secById[s].name)}</a>`:'').join('')}${(r.read||[]).map(x=>byId[x]?`<a class="r" href="#f-${x}">Leer: ${esc(byId[x].t)}</a>`:'').join('')}</div>
       <div class="foot">${ids.length?`<div class="bar ${pct===100?'ok':''}" title="${dl} de ${ids.length}"><i style="width:${pct}%"></i></div><span class="muted">${dl} / ${ids.length}</span>`:'<span></span>'}
       <span class="chips">${ids.length?`<button type="button" class="btn pri" data-go="tarjetas" data-secs="${r.secs.join(',')}" data-label="${esc(r.t)}">Tarjetas</button><button type="button" class="btn" data-go="test" data-secs="${r.secs.join(',')}" data-label="${esc(r.t)}">Test</button>`:''}</span></div></article>`; }).join('')}</div>`;
}

/* ── tarjetas con repetición espaciada ── */
let fc=null; let fcDir='es';
function buildDeck(secs,label){
  let pool=studyIds(secs);
  if(label==='Pendientes de hoy') pool=pool.filter(isDue);
  const now=Date.now();
  const due=pool.filter(isDue).sort((a,b)=>(S.due[a]||0)-(S.due[b]||0));
  const fresh=shuffle(pool.filter(id=>S.box[id]===undefined));
  const rest=pool.filter(id=>S.box[id]!==undefined && !isDue(id)).sort((a,b)=>(S.due[a]||0)-(S.due[b]||0));
  const q=[...due,...fresh,...rest].slice(0,20);
  return {q,i:0,flip:false,done:0,ok:0,again:{}};
}
function renderTarjetas(){
  renderSide('e-tarjetas');
  if(!fc) fc=buildDeck(pick.secs,pick.label);
  const head=`<div class="sec-head"><span class="eyebrow">Modo estudio</span><h1>Tarjetas</h1><p class="lead">Piensa la respuesta, toca la tarjeta para darle la vuelta y di si te la sabías. Las que fallas vuelven enseguida; las que aciertas, cada vez más tarde.</p></div>
   <div class="tool">${secSelect('fcSec',true,pick.secs)}<label class="field">Sentido<select id="fcDir"><option value="es" ${fcDir==='es'?'selected':''}>Español → ${esc(META.langName)}</option><option value="t" ${fcDir==='t'?'selected':''}>${esc(META.langName[0].toUpperCase()+META.langName.slice(1))} → español</option></select></label></div>`;
  if(!fc.q.length){ main.innerHTML=head+`<div class="empty">No hay tarjetas para esta selección.</div>`; bindFcControls(); return; }
  if(fc.i>=fc.q.length){
    main.innerHTML=head+`<div class="panel" style="text-align:center;display:grid;gap:12px;justify-items:center"><h2 style="margin:0">Ronda terminada</h2><p class="muted" style="margin:0">Has repasado ${fc.done} tarjetas y te sabías ${fc.ok} a la primera.</p><div class="tool" style="margin:0;justify-content:center"><button type="button" class="btn pri" id="fcAgain">Otra ronda</button><a class="btn" href="#e-test">Hacer un test</a></div></div>`;
    bindFcControls(); document.getElementById('fcAgain').onclick=()=>{ fc=buildDeck(pick.secs,pick.label); renderTarjetas(); }; return;
  }
  const e=byId[fc.q[fc.i]];
  const front = fcDir==='es' ? `<span class="q">${esc(e.es)}</span>` : `<span class="q">${esc(e.t)}</span>${e.tr?`<span class="tr">${esc(e.tr)}</span>`:''}`;
  const backS = fcDir==='es' ? `<span class="a">${esc(e.t)}</span>${e.tr?`<span class="tr">${esc(e.tr)}</span>`:''}<span class="pr">${prHTML(e.pr)}</span>` : `<span class="a">${esc(e.es)}</span><span class="pr">${prHTML(e.pr)}</span>`;
  main.innerHTML=head+`<div class="stat-line" style="justify-content:center"><span>Tarjeta <b>${fc.i+1} / ${fc.q.length}</b></span><span>${esc(secById[e.sec].name)}</span></div>
   <button type="button" class="fc" id="fcCard" aria-live="polite">${front}${fc.flip?`<hr>${backS}`:`<span class="hint">Toca para ver la respuesta</span>`}</button>
   <div class="fc-actions">${fc.flip?`<button type="button" class="btn ko" id="fcNo">Otra vez</button><button type="button" class="btn ok" id="fcYes">Me la sé</button>`:`<button type="button" class="btn pri" id="fcShow">Ver respuesta</button>`}${sayBtn(e.say||e.t,false)}<a class="btn" href="#f-${e.id}">Ficha</a></div>`;
  bindFcControls();
  const flip=()=>{ if(!fc.flip){ fc.flip=true; renderTarjetas(); if(fcDir==='es') speak(e.say||e.t);} };
  document.getElementById('fcCard').onclick=flip;
  const sh=document.getElementById('fcShow'); if(sh) sh.onclick=flip;
  const ans=ok=>{ const id=e.id; const first=!fc.again[id]; grade(id,ok); fc.done+= first?1:0; if(ok&&first) fc.ok++; if(!ok){ fc.again[id]=1; if(fc.q.slice(fc.i+1).indexOf(id)<0) fc.q.push(id);} fc.i++; fc.flip=false; renderSide(); renderTarjetas(); };
  const y=document.getElementById('fcYes'), n=document.getElementById('fcNo'); if(y) y.onclick=()=>ans(true); if(n) n.onclick=()=>ans(false);
}
function bindFcControls(){
  const s=document.getElementById('fcSec'), d=document.getElementById('fcDir');
  if(s) s.onchange=()=>{ pick={secs:readSel(s.value),label:s.value==='__pick'?pick.label:''}; fc=null; renderTarjetas(); };
  if(d) d.onchange=()=>{ fcDir=d.value; if(fc) fc.flip=false; renderTarjetas(); };
}
document.addEventListener('keydown',ev=>{
  if(location.hash!=='#e-tarjetas' || !ov.hidden || ev.target.matches('input,select,textarea')) return;
  if(ev.key===' '){ const c=document.getElementById('fcShow')||null; if(c){ev.preventDefault(); c.click();} }
  if(ev.key==='1'){ const n=document.getElementById('fcNo'); if(n) n.click(); }
  if(ev.key==='2'){ const y=document.getElementById('fcYes'); if(y) y.click(); }
});

/* ── test ── */
let qz=null;
function makeQuiz(secs,onlyIds){
  let pool=onlyIds||studyIds(secs);
  const all=studyIds();
  const picks=shuffle(pool).slice(0,10);
  const types=['es2t','t2es']; if(canSpeak) types.push('listen'); if(META.translit) types.push('read');
  return {qs:picks.map(id=>{
    const e=byId[id]; let ty=types[Math.floor(Math.random()*types.length)]; if(ty==='read'&&!e.tr) ty='t2es';
    const same=pool.length>=4?pool:all;
    const label=x=> ty==='t2es'?byId[x].es:(ty==='read'?byId[x].tr:byId[x].t);
    const seen=new Set([norm(label(id))]); const ds=[];
    for(const x of shuffle(same.concat(all))){ if(x===id) continue; const L=norm(label(x)); if(!L||seen.has(L)) continue; seen.add(L); ds.push(x); if(ds.length===3) break; }
    return {id,ty,opts:shuffle([id,...ds]),ans:null};
  }),i:0,secs,label:pick.label};
}
function renderTest(){
  renderSide('e-test');
  const head=`<div class="sec-head"><span class="eyebrow">Modo estudio</span><h1>Test</h1><p class="lead">Diez preguntas variadas: traducir en los dos sentidos${canSpeak?', escuchar y elegir':''}${META.translit?' y leer el alfabeto griego':''}. Los fallos pasan a tus tarjetas pendientes.</p></div>`;
  if(!qz){
    main.innerHTML=head+`<div class="tool">${secSelect('qzSec',true,pick.secs)}<button type="button" class="btn pri" id="qzStart" style="align-self:flex-end">Empezar test</button></div>
     ${S.tests.length?`<h2 class="sub">Últimos resultados</h2>${S.tests.slice(-6).reverse().map(t=>`<div class="prog-row"><span style="text-align:left;color:var(--ink)">${esc(t.label||'Todo')}</span><div class="bar ${t.ok===t.n?'ok':''}"><i style="width:${Math.round(t.ok*100/t.n)}%"></i></div><span>${t.ok} / ${t.n}</span></div>`).join('')}`:''}`;
    document.getElementById('qzStart').onclick=()=>{ const v=document.getElementById('qzSec').value; pick={secs:readSel(v),label:v==='__pick'?pick.label:(v&&secById[v]?secById[v].name:'Todo')}; qz=makeQuiz(pick.secs); renderTest(); };
    return;
  }
  if(qz.i>=qz.qs.length){
    const ok=qz.qs.filter(q=>q.ans===q.id).length; const fails=qz.qs.filter(q=>q.ans!==q.id);
    if(!qz.saved){ S.tests.push({label:qz.label||'Todo',ok,n:qz.qs.length,d:Date.now()}); S.tests=S.tests.slice(-20); save(); qz.saved=1; }
    main.innerHTML=head+`<div class="panel" style="display:grid;gap:12px"><h2 style="margin:0">${ok} de ${qz.qs.length} correctas</h2><div class="bar ${ok===qz.qs.length?'ok':''}"><i style="width:${Math.round(ok*100/qz.qs.length)}%"></i></div>
      ${fails.length?`<p class="muted" style="margin:0">Repasa estas fichas:</p><div class="cards">${fails.map(q=>card(byId[q.id])).join('')}</div>`:'<p style="margin:0">Sin fallos. Buen trabajo.</p>'}
      <div class="tool" style="margin:0">${fails.length?`<button type="button" class="btn pri" id="qzFails">Repetir los fallos</button>`:''}<button type="button" class="btn" id="qzNew">Nuevo test</button><a class="btn" href="#e-tarjetas">Ir a tarjetas</a></div></div>`;
    const f=document.getElementById('qzFails'); if(f) f.onclick=()=>{ qz=makeQuiz(null,fails.map(q=>q.id)); qz.label=(pick.label||'Todo')+' · fallos'; renderTest(); };
    document.getElementById('qzNew').onclick=()=>{ qz=null; renderTest(); };
    return;
  }
  const q=qz.qs[qz.i], e=byId[q.id];
  const KQ={es2t:`¿Cómo se dice en ${META.langName}?`,t2es:'¿Qué significa?',listen:'Escucha y elige lo que oyes',read:'¿Cómo se lee?'};
  const prompt = q.ty==='es2t'?esc(e.es):q.ty==='listen'?`<button type="button" class="say big-say" data-say="${esc(e.say||e.t)}">${ICON}Escuchar</button>`:`${esc(e.t)}`;
  const optLabel = x => { const o=byId[x]; if(q.ty==='t2es') return esc(o.es); if(q.ty==='read') return `<span style="font-family:var(--f-mono)">${esc(o.tr)}</span>`; return `${esc(o.t)}${o.tr&&q.ans!==null?`<small>${esc(o.tr)}</small>`:''}`; };
  main.innerHTML=head+`<div class="quiz"><div class="stat-line" style="justify-content:center;margin:0"><span>Pregunta <b>${qz.i+1} / ${qz.qs.length}</b></span></div>
    <div class="bar"><i style="width:${Math.round(qz.i*100/qz.qs.length)}%"></i></div>
    <div class="qkind">${KQ[q.ty]}</div><div class="qtext">${prompt}</div>
    <div class="opts">${q.opts.map(x=>`<button type="button" class="opt ${q.ans!==null?(x===q.id?'ok':(x===q.ans?'ko':'')):''}" data-opt="${x}" ${q.ans!==null?'disabled':''}>${optLabel(x)}</button>`).join('')}</div>
    ${q.ans!==null?`<div class="panel" style="display:grid;gap:6px"><b style="color:${q.ans===q.id?'var(--ok)':'var(--ko)'};font-family:var(--f-display)">${q.ans===q.id?'Correcto':'Era esta'}</b><span style="font-family:var(--f-display);font-weight:600">${esc(e.t)}</span>${e.tr?`<span class="pr" style="color:var(--second)">${esc(e.tr)}</span>`:''}<span class="muted">${esc(e.es)}</span><div class="tool" style="margin:4px 0 0">${sayBtn(e.say||e.t)}<a class="btn" href="#f-${e.id}">Ficha</a><button type="button" class="btn pri" id="qzNext">${qz.i+1<qz.qs.length?'Siguiente':'Ver resultado'}</button></div></div>`:''}
    <div class="tool" style="justify-content:center"><button type="button" class="btn" id="qzQuit">Salir del test</button></div></div>`;
  if(q.ty==='listen' && q.ans===null) speak(e.say||e.t);
  main.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ if(q.ans!==null) return; q.ans=b.dataset.opt; if(q.ans!==q.id) grade(q.id,false); renderSide(); renderTest(); });
  const n=document.getElementById('qzNext'); if(n){ n.onclick=()=>{ qz.i++; renderTest(); window.scrollTo(0,0); }; n.focus({preventScroll:true}); }
  document.getElementById('qzQuit').onclick=()=>{ qz=null; renderTest(); };
}

/* ── ejercicios ── */
function renderEjercicios(){
  renderSide('e-ejercicios'); exStats={ok:0,ko:0};
  const rules=DATA.filter(e=>e.ejx&&e.ejx.length);
  main.innerHTML=`<div class="sec-head"><span class="eyebrow">Modo estudio</span><h1>Ejercicios</h1><p class="lead">Huecos para rellenar sobre cada regla de gramática. Escribe la respuesta y pulsa Comprobar o Intro. Las tildes no cuentan.</p></div>
   <div class="stat-line" id="exCount">Correctas <b>0</b> · Fallos <b>0</b></div>
   ${rules.map(e=>`<section class="rule-ex"><h3><a class="xref" href="#f-${e.id}">${esc(e.t)}</a></h3>${exList(e)}</section>`).join('')}`;
}

/* ── chuletas ── */
let cheatSel='gramatica';
function renderChuletas(){
  renderSide('e-chuletas');
  const opts=[['__gram','Gramática: todas las tablas'],['__all','Todas las frases y palabras'],...META.sections.map(s=>[s.id,s.name])];
  if(!opts.some(o=>o[0]===cheatSel)) cheatSel=secById[cheatSel]?cheatSel:'__gram';
  if(cheatSel==='gramatica') cheatSel='__gram';
  let body='';
  if(cheatSel==='__gram'){
    const rules=DATA.filter(e=>e.k==='regla'||(e.k==='tabla'&&e.body));
    body=`<div class="cheat-g">${rules.map(e=>`<section><h3>${esc(e.t)} <span class="muted" style="font-weight:400;font-size:14px">· ${esc(e.es)}</span></h3><p>${linkify(e.uso)}</p>${e.body?linkify(e.body):''}${e.err&&e.err.length?`<p>${e.err.map(x=>`<s style="color:var(--ko)">${esc(x[0])}</s> → <b>${esc(x[1])}</b>`).join(' · ')}</p>`:''}</section>`).join('')}</div>`;
  } else {
    const secs=cheatSel==='__all'?META.sections.map(s=>s.id):[cheatSel];
    body=`<div class="cheat">${secs.map(sid=>{ const s=secById[sid]; const list=DATA.filter(e=>e.sec===sid && e.k!=='regla');
      if(!list.length) return '';
      return `<h3>${esc(s.name)}</h3>`+list.map(e=>{
        if(e.k==='dialogo') return `<div class="ci"><b>${esc(e.t)} · ${esc(e.es)}</b>${(e.lines||[]).map(l=>`<span><b>${esc(l[1])}</b> — ${esc(l[2])}</span>`).join('')}</div>`;
        if(e.k==='tabla'||e.k==='sonido'||e.k==='letra') return `<div class="ci"><b>${esc(e.t)}</b><span>${esc(e.es)}</span>${e.pr?`<span class="pr">${prHTML(e.pr)}</span>`:''}</div>`;
        return `<div class="ci"><b>${esc(e.t)}</b>${e.tr?`<span class="tr">${esc(e.tr)}</span>`:''}<span>${esc(e.es)} · <span class="pr">${prHTML(e.pr)}</span></span></div>`;
      }).join(''); }).join('')}</div>`;
  }
  main.innerHTML=`<div class="sec-head"><span class="eyebrow">Modo estudio</span><h1>Chuletas</h1><p class="lead">Resumen condensado sin explicaciones, para repasar de un vistazo. Si lo tienes publicado en tu web, al imprimir la página desde el navegador sale solo la chuleta.</p></div>
   <div class="tool"><label class="field">Chuleta de<select id="chSel">${opts.map(o=>`<option value="${o[0]}" ${o[0]===cheatSel?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label></div>${body}`;
  document.getElementById('chSel').onchange=ev=>{ cheatSel=ev.target.value; renderChuletas(); };
}

/* ── progreso ── */
let resetArmed=false;
function renderProgreso(){
  renderSide('e-progreso');
  const all=studyIds(); const l=all.filter(learned).length; const rev=all.filter(id=>S.box[id]!==undefined&&!learned(id)).length;
  main.innerHTML=`<div class="sec-head"><span class="eyebrow">Modo estudio</span><h1>Progreso</h1><p class="lead">Una frase cuenta como aprendida cuando la aciertas al menos dos veces seguidas en tarjetas o la marcas como sabida en su ficha. Todo se guarda solo en este navegador.</p></div>
   <div class="big-stats"><div><b>${l}</b><span>aprendidas</span></div><div><b>${rev}</b><span>en repaso</span></div><div><b>${all.length-l-rev}</b><span>sin estudiar</span></div><div><b>${dueCount()}</b><span>pendientes hoy</span></div></div>
   <h2 class="sub">Por sección</h2>
   ${META.sections.map(s=>{ const ids=studyIds([s.id]); if(!ids.length) return ''; const k=ids.filter(learned).length; const pct=Math.round(k*100/ids.length);
     return `<div class="prog-row"><a href="#s-${s.id}">${esc(s.name)}</a><div class="bar ${pct===100?'ok':''}"><i style="width:${pct}%"></i></div><span>${k} / ${ids.length}</span></div>`; }).join('')}
   <h2 class="sub">Empezar de cero</h2><p class="muted">Borra el progreso de tarjetas y test de este navegador. Tus frases guardadas se mantienen.</p>
   <div class="tool"><button type="button" class="btn ${resetArmed?'ko':''}" id="resetBtn">${resetArmed?'Pulsa otra vez para confirmar':'Borrar progreso'}</button>${resetArmed?'<button type="button" class="btn" id="resetCancel">Cancelar</button>':''}</div>`;
  document.getElementById('resetBtn').onclick=()=>{ if(!resetArmed){ resetArmed=true; renderProgreso(); return; } S.box={}; S.due={}; S.tests=[]; save(); resetArmed=false; fc=null; renderProgreso(); };
  const c=document.getElementById('resetCancel'); if(c) c.onclick=()=>{ resetArmed=false; renderProgreso(); };
}

/* ── rutas ── */
const qi=document.getElementById('q');
function render(keep){
  const h=location.hash.slice(1)||'inicio';
  if(h.startsWith('f-')){ if(main.innerHTML.trim()===''){ const e=byId[h.slice(2)]; e?renderSection(e.sec):renderHome(); } openFicha(h.slice(2)); return; }
  ov.hidden=true; document.body.style.overflow=''; curFicha='';
  if(!keep && ('#'+h)===lastView && qi.value.trim().length>=2 && main.innerHTML.trim()) return;
  const changed = ('#'+h)!==lastView;
  lastView='#'+h;
  if(qi.value.trim() && !keep) qi.value='';
  if(h.startsWith('e-') && !isStudy()){ S.mode='estudio'; save(); }
  if(h==='e-ruta') renderRuta();
  else if(h==='e-tarjetas') renderTarjetas();
  else if(h==='e-test') renderTest();
  else if(h==='e-ejercicios') renderEjercicios();
  else if(h==='e-chuletas') renderChuletas();
  else if(h==='e-progreso') renderProgreso();
  else if(h==='favs') renderFavs();
  else if(h.startsWith('s-')) renderSection(h.slice(2));
  else renderHome();
  if(changed) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>render(false));
qi.addEventListener('input',()=>{ const v=qi.value.trim(); if(v.length>=2) renderSearch(v); else if(!v) render(true); });
document.addEventListener('keydown',ev=>{ if(ev.key!=='Escape') return; if(!ov.hidden) closeFicha(); else closeNav(); });

/* ── tema ── */
function setTheme(t){ const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
  document.querySelectorAll('.themes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t))); try{localStorage.setItem('tema',t)}catch(e){} }
document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
let t0='auto'; try{t0=localStorage.getItem('tema')||'auto'}catch(e){} setTheme(t0);

document.getElementById('foot').innerHTML=META.footer;
render(false);
</script>
